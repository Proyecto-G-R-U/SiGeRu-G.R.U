# SSH del servidor de respaldo: solo el usuario respaldo, solo con clave
HostKey /etc/ssh/hostkeys/ssh_host_ed25519_key
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
UsePAM no
AllowUsers respaldo
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no

