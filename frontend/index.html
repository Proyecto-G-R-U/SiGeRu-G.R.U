<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.U — Panel</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- ============================================================
     PANTALLA 1: LOGIN (se muestra al entrar, sin sesión)
     ============================================================ -->
<div class="login-screen" id="pantalla-login">
    <div class="login-card">
        <h1>G.R.U</h1>
        <p class="login-sub">Gestión de Residuos Urbanos</p>
        <p class="login-desc">Ingresá con tu cuenta para acceder al sistema.</p>
        <form id="form-login">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required>
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" required>
            <button type="submit" class="btn">Ingresar</button>
        </form>
        <p class="msg" id="login-msg"></p>
        <a class="link" href="registro.html">¿No tenés cuenta? Registrate como vecino</a>
    </div>
</div>

<!-- ============================================================
     PANTALLA 2: APP (sidebar + header + contenido)
     Oculta hasta iniciar sesión. El color lo pone la clase de rol
     en <body> (tema-vecino, tema-admin, etc.) vía JavaScript.
     ============================================================ -->
<div class="app oculto" id="pantalla-app">

    <!-- SIDEBAR (color según rol) -->
    <aside class="sidebar">
        <div class="logo">
            <h1>G.R.U</h1>
            <p>Gestión de Residuos Urbanos</p>
        </div>
        <nav class="nav" id="nav-menu">
            <!-- El menú se arma por JS según el rol -->
        </nav>
    </aside>

    <!-- ZONA DERECHA: header + contenido -->
    <div class="main">
        <header class="header">
            <span class="header-title" id="header-title">Panel</span>
            <div class="header-right">
                <span class="header-name" id="header-name"></span>
                <span class="badge" id="header-badge"></span>
                <button class="btn-salir" onclick="cerrarSesion()">
                    <span class="material-icons-outlined">logout</span> Cerrar Sesión
                </button>
            </div>
        </header>

        <main class="content" id="content">
            <!-- El contenido se arma por JS según el rol -->
        </main>
    </div>
</div>

<!-- ============================================================
     JAVASCRIPT EMBEBIDO
     ============================================================ -->
<script>
    const API_USUARIOS    = '../api-usuarios';
    const API_GESTION     = '../api-gestion';
    const API_RECOLECCION = '../api-recoleccion';

    // Usuario logueado (para saber su rol/especialidad y su email).
    let usuarioActual = null;

    // Caches en memoria para mostrar nombres (no ids) de cuadrillas y flotas.
    let cacheCuadrillas = [];
    let cacheFlotas = [];
    let cacheUsuarios = [];

    // -------------------------------------------------------------
    // CONFIGURACIÓN DE CADA ROL: color (clase de tema), título del
    // panel, texto del badge y el "tipo" con el que decidimos la vista.
    // El rol efectivo de un operario se arma como 'operario_<especialidad>'.
    // -------------------------------------------------------------
    const ROLES = {
        vecino:                 { tema: 'tema-vecino',        titulo: 'Panel Informativo Vecinal', badge: 'Público' },
        administrador:          { tema: 'tema-admin',         titulo: 'Panel Administrativo',       badge: 'Admin Municipal' },
        operario_recoleccion:   { tema: 'tema-recoleccion',   titulo: 'Panel de Recolección',       badge: 'Op. Recolección' },
        operario_clasificacion: { tema: 'tema-clasificacion', titulo: 'Panel de Clasificación',     badge: 'Op. Clasificación' },
        operario_vertedero:     { tema: 'tema-vertedero',     titulo: 'Panel de Vertedero',         badge: 'Op. Vertedero' },
    };

    // Devuelve el rol efectivo de un usuario (distingue los 3 operarios).
    function rolEfectivo(u) {
        if (u.rol === 'operario') {
            return 'operario_' + (u.especialidad || 'recoleccion');
        }
        return u.rol;
    }

    // -------------------------------------------------------------
    // LOGIN
    // -------------------------------------------------------------
    const formLogin = document.getElementById('form-login');
    const loginMsg  = document.getElementById('login-msg');

    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginMsg.textContent = '';
        loginMsg.className = 'msg';
        const datos = {
            email:    document.getElementById('login-email').value.trim(),
            password: document.getElementById('login-password').value,
        };
        try {
            const resp = await fetch(API_USUARIOS + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                entrarAlPanel(resultado.usuario);
            } else {
                loginMsg.textContent = resultado.error || 'No se pudo iniciar sesión.';
                loginMsg.classList.add('err');
            }
        } catch (err) {
            loginMsg.textContent = 'No se pudo conectar con la API de Usuarios.';
            loginMsg.classList.add('err');
        }
    });

    function entrarAlPanel(usuario) {
        usuarioActual = usuario;
        const rol = rolEfectivo(usuario);
        const cfg = ROLES[rol] || ROLES.vecino;

        // Aplicar el color del tema en el body.
        document.body.className = cfg.tema;

        // Header
        document.getElementById('header-title').textContent = cfg.titulo;
        document.getElementById('header-name').textContent = usuario.nombre;
        document.getElementById('header-badge').textContent = cfg.badge;

        // Mostrar la app, ocultar login
        document.getElementById('pantalla-login').classList.add('oculto');
        document.getElementById('pantalla-app').classList.remove('oculto');

        // Armar menú y contenido según el rol
        construirMenu(rol);
        // Por defecto mostramos "Inicio"
        mostrarSeccion('inicio');
    }

    function cerrarSesion() {
        usuarioActual = null;
        document.body.className = '';
        document.getElementById('pantalla-app').classList.add('oculto');
        document.getElementById('pantalla-login').classList.remove('oculto');
        formLogin.reset();
        loginMsg.textContent = '';
    }

    // -------------------------------------------------------------
    // MENÚ LATERAL según el rol
    // Solo el administrador tiene secciones de gestión. El resto solo "Inicio".
    // -------------------------------------------------------------
    function construirMenu(rol) {
        const nav = document.getElementById('nav-menu');
        let items = [{ id: 'inicio', icono: 'home', texto: 'Inicio' }];

        if (rol === 'administrador') {
            items.push(
                { id: 'usuarios',     icono: 'group',          texto: 'Usuarios' },
                { id: 'contenedores', icono: 'delete',         texto: 'Contenedores' },
                { id: 'camiones',     icono: 'local_shipping', texto: 'Camiones' },
                { id: 'flotas',       icono: 'grid_view',      texto: 'Flotas' },
            );
        }

        nav.innerHTML = items.map(function (it, i) {
            return '<a class="nav-item' + (i === 0 ? ' activo' : '') + '" ' +
                'id="nav-' + it.id + '" onclick="mostrarSeccion(\'' + it.id + '\')">' +
                '<span class="material-icons-outlined">' + it.icono + '</span> ' + it.texto + '</a>';
        }).join('');
    }

    // -------------------------------------------------------------
    // CAMBIO DE SECCIÓN
    // -------------------------------------------------------------
    function mostrarSeccion(id) {
        // marcar activo en el menú
        document.querySelectorAll('.nav-item').forEach(function (a) { a.classList.remove('activo'); });
        const navEl = document.getElementById('nav-' + id);
        if (navEl) navEl.classList.add('activo');

        const content = document.getElementById('content');

        if (id === 'inicio') {
            // Los no-administradores ven su panel vacío (solo bienvenida),
            // porque por ahora solo el admin tiene funciones.
            content.innerHTML = '<div class="bienvenida"><h2>Hola, ' +
                usuarioActual.nombre + '</h2><p>Bienvenido a tu panel. ' +
                (rolEfectivo(usuarioActual) === 'administrador'
                    ? 'Usá el menú lateral para gestionar usuarios, contenedores y camiones.'
                    : 'Por el momento este panel es informativo.') +
                '</p></div>';
            return;
        }

        // Secciones de administrador
        if (id === 'usuarios')     { content.innerHTML = plantillaUsuarios();     cargarUsuarios(); cargarCuadrillas(); }
        if (id === 'contenedores') { content.innerHTML = plantillaContenedores(); cargarContenedores(); }
        if (id === 'camiones')     { content.innerHTML = plantillaCamiones();     cargarCamiones(); cargarFlotasEnSelect(); cargarCuadrillasEnSelect(); }
        if (id === 'flotas')       { content.innerHTML = plantillaFlotas();       cargarPanelFlotas(); }
    }

    // =============================================================
    //  PLANTILLAS DE SECCIÓN (solo admin)
    // =============================================================
    function plantillaUsuarios() {
        return ''
        + '<div class="panel"><h3>Nuevo usuario</h3>'
        + '<form id="form-usuario" class="form-inline">'
        + '<div><label>Nombre</label><input type="text" id="u-nombre" required></div>'
        + '<div><label>Email</label><input type="email" id="u-email" required></div>'
        + '<div><label>Contraseña</label><input type="password" id="u-password" required></div>'
        + '<div><label>Rol</label><select id="u-rol" onchange="toggleEspecialidad()">'
        + '<option value="vecino">Vecino</option>'
        + '<option value="operario">Operario</option>'
        + '<option value="administrador">Administrador</option></select></div>'
        + '<div id="wrap-especialidad" style="display:none;"><label>Especialidad</label>'
        + '<select id="u-especialidad">'
        + '<option value="recoleccion">Recolección</option>'
        + '<option value="clasificacion">Clasificación</option>'
        + '<option value="vertedero">Vertedero</option></select></div>'
        + '<div class="full"><button type="submit" class="btn">Agregar usuario</button></div>'
        + '</form><p class="msg" id="u-msg"></p></div>'
        + '<table class="tabla"><thead><tr><th>ID</th><th>Nombre</th><th>Email</th>'
        + '<th>Rol</th><th>Acción</th></tr></thead><tbody id="tabla-usuarios"></tbody></table>'
        + '<h2 class="sec-titulo">Cuadrillas</h2>'
        + '<div class="panel"><h3>Nueva cuadrilla</h3>'
        + '<form id="form-cuadrilla" class="form-inline">'
        + '<div><label>Nombre</label><input type="text" id="cu-nombre" required></div>'
        + '<div><label>Zona</label><input type="text" id="cu-zona"></div>'
        + '<div class="full"><button type="submit" class="btn">Crear cuadrilla</button></div>'
        + '</form><p class="msg" id="cu-msg"></p></div>'
        + '<table class="tabla"><thead><tr><th>ID</th><th>Nombre</th><th>Zona</th>'
        + '<th>Operarios</th><th>Acción</th></tr></thead><tbody id="tabla-cuadrillas"></tbody></table>';
    }

    function plantillaContenedores() {
        return ''
        + '<div class="panel"><h3>Nuevo contenedor</h3>'
        + '<form id="form-contenedor" class="form-inline">'
        + '<div><label>Código</label><input type="text" id="c-codigo" required></div>'
        + '<div><label>Ubicación</label><input type="text" id="c-ubicacion" required></div>'
        + '<div><label>Tipo de residuo</label><select id="c-tipo">'
        + '<option value="mezclado">Mezclado</option>'
        + '<option value="reciclable">Reciclable</option></select></div>'
        + '<div><label>Estado</label><select id="c-estado">'
        + '<option value="operativo">Operativo</option>'
        + '<option value="roto">Roto</option>'
        + '<option value="desbordado">Desbordado</option></select></div>'
        + '<div class="full"><button type="submit" class="btn">Agregar contenedor</button></div>'
        + '</form><p class="msg" id="c-msg"></p></div>'
        + '<table class="tabla"><thead><tr><th>ID</th><th>Código</th><th>Ubicación</th>'
        + '<th>Tipo</th><th>Estado</th></tr></thead><tbody id="tabla-contenedores"></tbody></table>';
    }

    function plantillaCamiones() {
        return ''
        + '<div class="panel"><h3>Nuevo camión</h3>'
        + '<form id="form-camion" class="form-inline">'
        + '<div><label>Patente</label><input type="text" id="k-patente" required></div>'
        + '<div><label>Modelo</label><input type="text" id="k-modelo" required></div>'
        + '<div><label>Estado</label><select id="k-estado">'
        + '<option value="operativo">Operativo</option>'
        + '<option value="mantenimiento">Mantenimiento</option></select></div>'
        + '<div><label>Disponibilidad</label><select id="k-disp">'
        + '<option value="disponible">Disponible</option>'
        + '<option value="en_ruta">En ruta</option></select></div>'
        + '<div><label>Flota</label><select id="k-flota"></select></div>'
        + '<div><label>Cuadrilla</label><select id="k-cuadrilla"></select></div>'
        + '<div class="full"><button type="submit" class="btn">Agregar camión</button></div>'
        + '</form><p class="msg" id="k-msg"></p></div>'
        + '<table class="tabla"><thead><tr><th>ID</th><th>Patente</th><th>Modelo</th>'
        + '<th>Estado</th><th>Disponibilidad</th><th>Flota</th><th>Cuadrilla</th>'
        + '<th>Acción</th></tr></thead><tbody id="tabla-camiones"></tbody></table>';
    }

    function plantillaFlotas() {
        return ''
        + '<div class="panel"><h3>Nueva flota</h3>'
        + '<form id="form-flota" class="form-inline">'
        + '<div><label>Nombre</label><input type="text" id="f-nombre" required></div>'
        + '<div><label>Zona</label><input type="text" id="f-zona"></div>'
        + '<div class="full"><button type="submit" class="btn">Crear flota</button></div>'
        + '</form><p class="msg" id="f-msg"></p></div>'
        + '<div id="panel-flotas" class="flotas-grid"></div>';
    }

    // Muestra/oculta el selector de especialidad según el rol elegido.
    function toggleEspecialidad() {
        const rol = document.getElementById('u-rol').value;
        document.getElementById('wrap-especialidad').style.display =
            (rol === 'operario') ? 'block' : 'none';
    }

    // =============================================================
    //  USUARIOS (listado + alta + eliminar)
    // =============================================================
    async function cargarUsuarios() {
        const tbody = document.getElementById('tabla-usuarios');
        const esAdmin = usuarioActual && usuarioActual.rol === 'administrador';
        try {
            const resp = await fetch(API_USUARIOS + '/usuarios');
            const usuarios = await resp.json();
            tbody.innerHTML = usuarios.map(function (u) {
                let accion = '—';
                if (esAdmin && u.id !== usuarioActual.id) {
                    accion = '<button class="btn-eliminar" onclick="eliminarUsuario(' +
                        u.id + ", '" + u.nombre.replace(/'/g, "\\'") + "')" + '">Eliminar</button>';
                }
                // Mostramos rol + especialidad si es operario
                let rolTxt = u.rol;
                if (u.rol === 'operario' && u.especialidad) rolTxt += ' · ' + u.especialidad;
                return '<tr><td>' + u.id + '</td><td>' + u.nombre + '</td><td>' +
                    u.email + '</td><td>' + rolTxt + '</td><td>' + accion + '</td></tr>';
            }).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="5">Error al conectar con API Usuarios.</td></tr>';
        }

        // Enganchamos el form de alta (se recreó con la plantilla)
        const form = document.getElementById('form-usuario');
        if (form) form.onsubmit = altaUsuario;
    }

    async function altaUsuario(e) {
        e.preventDefault();
        const msg = document.getElementById('u-msg');
        msg.className = 'msg';
        const rol = document.getElementById('u-rol').value;
        const datos = {
            nombre:   document.getElementById('u-nombre').value.trim(),
            email:    document.getElementById('u-email').value.trim(),
            password: document.getElementById('u-password').value,
            rol:      rol,
        };
        if (rol === 'operario') {
            datos.especialidad = document.getElementById('u-especialidad').value;
        }
        try {
            const resp = await fetch(API_USUARIOS + '/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                msg.textContent = 'Usuario agregado.'; msg.classList.add('ok');
                e.target.reset();
                toggleEspecialidad();
                cargarUsuarios();
            } else {
                msg.textContent = resultado.error; msg.classList.add('err');
            }
        } catch (err) {
            msg.textContent = 'Error de conexión.'; msg.classList.add('err');
        }
    }

    async function eliminarUsuario(id, nombre) {
        if (!confirm('¿Seguro que querés eliminar a "' + nombre + '"?')) return;
        try {
            const resp = await fetch(API_USUARIOS + '/usuarios/eliminar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, adminEmail: usuarioActual.email }),
            });
            const resultado = await resp.json();
            if (resp.ok) { cargarUsuarios(); }
            else { alert(resultado.error || 'No se pudo eliminar.'); }
        } catch (err) {
            alert('Error de conexión al eliminar.');
        }
    }

    // =============================================================
    //  CONTENEDORES
    // =============================================================
    async function cargarContenedores() {
        const tbody = document.getElementById('tabla-contenedores');
        try {
            const resp = await fetch(API_GESTION + '/contenedores');
            const lista = await resp.json();
            tbody.innerHTML = lista.map(function (c) {
                return '<tr><td>' + c.id + '</td><td>' + c.codigo + '</td><td>' +
                    c.ubicacion + '</td><td>' + c.tipoResiduo + '</td><td>' + c.estado + '</td></tr>';
            }).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="5">Error al conectar con API Gestión.</td></tr>';
        }
        const form = document.getElementById('form-contenedor');
        if (form) form.onsubmit = altaContenedor;
    }

    async function altaContenedor(e) {
        e.preventDefault();
        const msg = document.getElementById('c-msg');
        msg.className = 'msg';
        const datos = {
            codigo:      document.getElementById('c-codigo').value.trim(),
            ubicacion:   document.getElementById('c-ubicacion').value.trim(),
            tipoResiduo: document.getElementById('c-tipo').value,
            estado:      document.getElementById('c-estado').value,
        };
        try {
            const resp = await fetch(API_GESTION + '/contenedores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                msg.textContent = 'Contenedor agregado.'; msg.classList.add('ok');
                e.target.reset(); cargarContenedores();
            } else {
                msg.textContent = resultado.error; msg.classList.add('err');
            }
        } catch (err) {
            msg.textContent = 'Error de conexión.'; msg.classList.add('err');
        }
    }

    // =============================================================
    //  CUADRILLAS (dentro de la sección Usuarios)
    // =============================================================
    async function cargarCuadrillas() {
        const tbody = document.getElementById('tabla-cuadrillas');
        if (!tbody) return;
        try {
            const resp = await fetch(API_USUARIOS + '/cuadrillas');
            cacheCuadrillas = await resp.json();
            tbody.innerHTML = cacheCuadrillas.map(function (c) {
                const cant = (c.operarios || []).length;
                return '<tr><td>' + c.id + '</td><td>' + c.nombre + '</td><td>' +
                    (c.zona || '—') + '</td><td>' + cant + ' operario(s)</td><td>' +
                    '<button class="btn-eliminar" onclick="eliminarCuadrilla(' + c.id + ')">Eliminar</button>' +
                    '</td></tr>';
            }).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="5">Error al conectar con API Usuarios.</td></tr>';
        }
        const form = document.getElementById('form-cuadrilla');
        if (form) form.onsubmit = altaCuadrilla;
    }

    async function altaCuadrilla(e) {
        e.preventDefault();
        const msg = document.getElementById('cu-msg');
        msg.className = 'msg';
        const datos = {
            nombre: document.getElementById('cu-nombre').value.trim(),
            zona:   document.getElementById('cu-zona').value.trim(),
        };
        try {
            const resp = await fetch(API_USUARIOS + '/cuadrillas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                msg.textContent = 'Cuadrilla creada.'; msg.classList.add('ok');
                e.target.reset(); cargarCuadrillas();
            } else {
                msg.textContent = resultado.error; msg.classList.add('err');
            }
        } catch (err) {
            msg.textContent = 'Error de conexión.'; msg.classList.add('err');
        }
    }

    async function eliminarCuadrilla(id) {
        if (!confirm('¿Eliminar esta cuadrilla?')) return;
        try {
            const resp = await fetch(API_USUARIOS + '/cuadrillas/eliminar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id }),
            });
            if (resp.ok) cargarCuadrillas();
            else { const r = await resp.json(); alert(r.error || 'No se pudo eliminar.'); }
        } catch (err) { alert('Error de conexión.'); }
    }

    // Devuelve el nombre de una cuadrilla por id (usa el cache).
    function nombreCuadrilla(id) {
        if (id === null || id === undefined) return '—';
        const c = cacheCuadrillas.find(function (x) { return x.id === id; });
        return c ? c.nombre : ('#' + id);
    }
    function nombreFlota(id) {
        if (id === null || id === undefined) return '—';
        const f = cacheFlotas.find(function (x) { return x.id === id; });
        return f ? f.nombre : ('#' + id);
    }

    // Carga los selects de flota y cuadrilla del formulario de camión.
    async function cargarFlotasEnSelect() {
        try {
            const resp = await fetch(API_RECOLECCION + '/flotas');
            cacheFlotas = await resp.json();
        } catch (err) { cacheFlotas = []; }
        const sel = document.getElementById('k-flota');
        if (sel) {
            sel.innerHTML = '<option value="">(sin flota)</option>' +
                cacheFlotas.map(function (f) {
                    return '<option value="' + f.id + '">' + f.nombre + '</option>';
                }).join('');
        }
    }
    async function cargarCuadrillasEnSelect() {
        try {
            const resp = await fetch(API_USUARIOS + '/cuadrillas');
            cacheCuadrillas = await resp.json();
        } catch (err) { cacheCuadrillas = []; }
        const sel = document.getElementById('k-cuadrilla');
        if (sel) {
            sel.innerHTML = '<option value="">(sin cuadrilla)</option>' +
                cacheCuadrillas.map(function (c) {
                    return '<option value="' + c.id + '">' + c.nombre + '</option>';
                }).join('');
        }
    }

    // =============================================================
    //  CAMIONES
    // =============================================================
    async function cargarCamiones() {
        const tbody = document.getElementById('tabla-camiones');
        // Aseguramos tener flotas y cuadrillas en cache para mostrar nombres.
        if (cacheFlotas.length === 0) { try { cacheFlotas = await (await fetch(API_RECOLECCION + '/flotas')).json(); } catch (e) {} }
        if (cacheCuadrillas.length === 0) { try { cacheCuadrillas = await (await fetch(API_USUARIOS + '/cuadrillas')).json(); } catch (e) {} }
        try {
            const resp = await fetch(API_RECOLECCION + '/camiones');
            const lista = await resp.json();
            tbody.innerHTML = lista.map(function (k) {
                // Selector de cuadrilla en línea para asignar.
                let opciones = '<option value="">(sin cuadrilla)</option>' +
                    cacheCuadrillas.map(function (c) {
                        const sel = (c.id === k.cuadrillaId) ? ' selected' : '';
                        return '<option value="' + c.id + '"' + sel + '>' + c.nombre + '</option>';
                    }).join('');
                const selectCuad = '<select onchange="asignarCuadrilla(' + k.id + ', this.value)">' + opciones + '</select>';
                return '<tr><td>' + k.id + '</td><td>' + k.patente + '</td><td>' +
                    k.modelo + '</td><td>' + k.estado + '</td><td>' + k.disponibilidad + '</td><td>' +
                    nombreFlota(k.flotaId) + '</td><td>' + selectCuad + '</td><td>' +
                    '<button class="btn-eliminar" onclick="eliminarCamion(' + k.id + ')">Eliminar</button>' +
                    '</td></tr>';
            }).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="8">Error al conectar con API Recolección.</td></tr>';
        }
        const form = document.getElementById('form-camion');
        if (form) form.onsubmit = altaCamion;
    }

    async function altaCamion(e) {
        e.preventDefault();
        const msg = document.getElementById('k-msg');
        msg.className = 'msg';
        const datos = {
            patente:        document.getElementById('k-patente').value.trim(),
            modelo:         document.getElementById('k-modelo').value.trim(),
            estado:         document.getElementById('k-estado').value,
            disponibilidad: document.getElementById('k-disp').value,
            flotaId:        document.getElementById('k-flota').value,
            cuadrillaId:    document.getElementById('k-cuadrilla').value,
        };
        try {
            const resp = await fetch(API_RECOLECCION + '/camiones', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                msg.textContent = 'Camión agregado.'; msg.classList.add('ok');
                e.target.reset(); cargarCamiones();
            } else {
                msg.textContent = resultado.error; msg.classList.add('err');
            }
        } catch (err) {
            msg.textContent = 'Error de conexión.'; msg.classList.add('err');
        }
    }

    async function asignarCuadrilla(camionId, cuadrillaId) {
        try {
            const resp = await fetch(API_RECOLECCION + '/camiones/asignar-cuadrilla', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: camionId, cuadrillaId: cuadrillaId || null }),
            });
            if (!resp.ok) { const r = await resp.json(); alert(r.error || 'No se pudo asignar.'); }
        } catch (err) { alert('Error de conexión.'); }
    }

    async function eliminarCamion(id) {
        if (!confirm('¿Eliminar este camión?')) return;
        try {
            const resp = await fetch(API_RECOLECCION + '/camiones/eliminar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id }),
            });
            if (resp.ok) cargarCamiones();
            else { const r = await resp.json(); alert(r.error || 'No se pudo eliminar.'); }
        } catch (err) { alert('Error de conexión.'); }
    }

    // =============================================================
    //  FLOTAS (panel gráfico)
    // =============================================================
    async function altaFlota(e) {
        e.preventDefault();
        const msg = document.getElementById('f-msg');
        msg.className = 'msg';
        const datos = {
            nombre: document.getElementById('f-nombre').value.trim(),
            zona:   document.getElementById('f-zona').value.trim(),
        };
        try {
            const resp = await fetch(API_RECOLECCION + '/flotas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                msg.textContent = 'Flota creada.'; msg.classList.add('ok');
                e.target.reset(); cargarPanelFlotas();
            } else {
                msg.textContent = resultado.error; msg.classList.add('err');
            }
        } catch (err) {
            msg.textContent = 'Error de conexión.'; msg.classList.add('err');
        }
    }

    // Dibuja el panel: una tarjeta por flota, con sus camiones dentro.
    // Al clickear un camión se muestra la cuadrilla asignada.
    async function cargarPanelFlotas() {
        const cont = document.getElementById('panel-flotas');
        const form = document.getElementById('form-flota');
        if (form) form.onsubmit = altaFlota;

        try {
            cacheFlotas     = await (await fetch(API_RECOLECCION + '/flotas')).json();
            cacheCuadrillas = await (await fetch(API_USUARIOS + '/cuadrillas')).json();
            const camiones  = await (await fetch(API_RECOLECCION + '/camiones')).json();

            cont.innerHTML = cacheFlotas.map(function (f) {
                const suyos = camiones.filter(function (k) { return k.flotaId === f.id; });
                const cards = suyos.length === 0
                    ? '<p class="flota-vacia">Sin camiones asignados</p>'
                    : suyos.map(function (k) {
                        return '<div class="camion-card" onclick="verCuadrillaCamion(' + k.id + ', \'' +
                            k.patente.replace(/'/g, "") + '\', ' + (k.cuadrillaId === null ? 'null' : k.cuadrillaId) + ')">' +
                            '<span class="material-icons-outlined">local_shipping</span>' +
                            '<span class="camion-pat">' + k.patente + '</span>' +
                            '<span class="camion-modelo">' + k.modelo + '</span></div>';
                    }).join('');
                return '<div class="flota-card"><div class="flota-head">' +
                    '<h3>' + f.nombre + '</h3><span class="flota-zona">' + (f.zona || '') + '</span>' +
                    '<button class="btn-eliminar" onclick="eliminarFlota(' + f.id + ')">Eliminar</button></div>' +
                    '<div class="camiones-wrap">' + cards + '</div></div>';
            }).join('') || '<p class="flota-vacia">No hay flotas. Creá una arriba.</p>';
        } catch (err) {
            cont.innerHTML = '<p class="flota-vacia">Error al conectar con las APIs.</p>';
        }
    }

    // Muestra la cuadrilla (y sus operarios) del camión clickeado.
    async function verCuadrillaCamion(camionId, patente, cuadrillaId) {
        if (cuadrillaId === null || cuadrillaId === undefined || cuadrillaId === 'null') {
            alert('El camión ' + patente + ' no tiene cuadrilla asignada.');
            return;
        }
        // Buscamos la cuadrilla en cache
        const cuad = cacheCuadrillas.find(function (c) { return c.id === cuadrillaId; });
        if (!cuad) { alert('Cuadrilla no encontrada.'); return; }

        // Traemos los usuarios para resolver los nombres de los operarios.
        if (cacheUsuarios.length === 0) {
            try { cacheUsuarios = await (await fetch(API_USUARIOS + '/usuarios')).json(); } catch (e) {}
        }
        const nombres = (cuad.operarios || []).map(function (opId) {
            const u = cacheUsuarios.find(function (x) { return x.id === opId; });
            return u ? ('• ' + u.nombre + (u.especialidad ? ' (' + u.especialidad + ')' : '')) : ('• #' + opId);
        });
        const detalle = nombres.length ? nombres.join('\n') : '(sin operarios asignados)';
        alert('Camión ' + patente + '\nCuadrilla: ' + cuad.nombre +
              (cuad.zona ? ' — ' + cuad.zona : '') + '\n\nOperarios:\n' + detalle);
    }

    async function eliminarFlota(id) {
        if (!confirm('¿Eliminar esta flota?')) return;
        try {
            const resp = await fetch(API_RECOLECCION + '/flotas/eliminar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id }),
            });
            if (resp.ok) cargarPanelFlotas();
            else { const r = await resp.json(); alert(r.error || 'No se pudo eliminar.'); }
        } catch (err) { alert('Error de conexión.'); }
    }
</script>
</body>
</html>
