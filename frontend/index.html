    // =============================================================
    //  MAPA INTERACTIVO DE ARMADO DE RUTAS
    //  Permite sumar o quitar contenedores del recorrido con un click,
    //  fijar la instalación de destino, y ver el trayecto dibujado.
    // =============================================================
    let cacheInstRutas = [];          // instalaciones (vienen de API Gestión)
    let mapaRutas = null;             // instancia Leaflet
    let capaRutas = null;             // capa con los pines
    let capaTrayecto = null;          // capa con las líneas del recorrido
    let rutaActivaId = null;          // qué ruta se está editando

    // Crea el mapa (una sola vez) y dibuja el estado actual.
    function prepararMapaRutas() {
        if (typeof L === 'undefined') {
            const div = document.getElementById('mapa-rutas');
            if (div) div.outerHTML = '<div class="mapa-error">No se pudo cargar el mapa. ' +
                'Verificá tu conexión a internet.</div>';
            dibujarParadas();
            return;
        }

        // Si no hay ruta activa todavía, tomamos la primera de la lista.
        if (rutaActivaId === null && cacheRutas.length > 0) {
            rutaActivaId = cacheRutas[0].id;
        }
        llenarSelectorRutaActiva();

        setTimeout(function () {
            if (document.getElementById('mapa-rutas') && !mapaRutas) {
                mapaRutas = L.map('mapa-rutas').setView(MVD, 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap', maxZoom: 19,
                }).addTo(mapaRutas);
                capaTrayecto = L.layerGroup().addTo(mapaRutas);
                capaRutas    = L.layerGroup().addTo(mapaRutas);
            }
            dibujarMapaRutas();
            setTimeout(function () { if (mapaRutas) mapaRutas.invalidateSize(); }, 250);
        }, 100);
    }

    // Llena el desplegable que elige qué ruta se está armando.
    function llenarSelectorRutaActiva() {
        const sel = document.getElementById('rt-activa');
        if (!sel) return;
        if (cacheRutas.length === 0) {
            sel.innerHTML = '<option value="">(creá una ruta primero)</option>';
            return;
        }
        sel.innerHTML = cacheRutas.map(function (r) {
            return '<option value="' + r.id + '"' + (r.id === rutaActivaId ? ' selected' : '') + '>' +
                r.nombre + ' — ' + r.diaLegible + ' ' + r.turno + '</option>';
        }).join('');
    }

    // Cambia la ruta que se está editando y redibuja.
    function cambiarRutaActiva(id) {
        rutaActivaId = id ? parseInt(id) : null;
        dibujarMapaRutas();
    }

    /** Devuelve el objeto de la ruta que se está editando. */
    function rutaActiva() {
        return cacheRutas.find(function (r) { return r.id === rutaActivaId; }) || null;
    }

    // ---- Íconos ----

    // Pin numerado para una parada del recorrido.
    function iconoParada(numero) {
        return L.divIcon({
            className: 'pin-ruta',
            html: '<span class="pin-num">' + numero + '</span>',
            iconSize: [26, 26],
            iconAnchor: [13, 13],
        });
    }

    // Pin de un contenedor que NO está en el recorrido (atenuado).
    function iconoLibre(color) {
        return L.divIcon({
            className: 'pin-ruta',
            html: '<span class="pin-libre" style="background:' + color + '"></span>',
            iconSize: [16, 16],
            iconAnchor: [8, 8],
        });
    }

    // Pin de instalación: cuadrado, con borde marcado si es el destino.
    function iconoInstalacion(color, esDestino) {
        return L.divIcon({
            className: 'pin-ruta',
            html: '<span class="pin-inst' + (esDestino ? ' pin-inst-dest' : '') +
                  '" style="background:' + color + '"></span>',
            iconSize: esDestino ? [26, 26] : [20, 20],
            iconAnchor: esDestino ? [13, 13] : [10, 10],
        });
    }

    // Dibuja todos los pines y el trayecto de la ruta activa.
    function dibujarMapaRutas() {
        dibujarParadas();
        if (!capaRutas) return;
        capaRutas.clearLayers();
        capaTrayecto.clearLayers();

        const r = rutaActiva();
        const ids = r ? (r.contenedores || []) : [];

        // El trayecto se recalcula abajo; limpiamos el dato anterior.
        const elTray = document.getElementById('rt-trayecto');
        if (elTray) elTray.innerHTML = (ids.length > 1)
            ? '<span class="trayecto-calc">Calculando recorrido por calles…</span>' : '';

        // --- Contenedores ---
        cacheContRutas.forEach(function (c) {
            if (c.lat === null || c.lng === null) return;
            const pos = ids.indexOf(c.id);          // -1 si no está en la ruta
            const enRuta = pos !== -1;

            const marcador = L.marker([c.lat, c.lng], {
                icon: enRuta ? iconoParada(pos + 1) : iconoLibre(colorEstado(c.estado)),
                zIndexOffset: enRuta ? 500 : 0,
            });

            marcador.bindPopup('<b>' + c.codigo + '</b><br>' + c.direccion +
                '<br>Llenado: ' + textoLlenado(c.nivelLlenado) +
                '<br><i>' + (enRuta ? 'Parada ' + (pos + 1) + ' — click para quitarla'
                                    : 'Click para sumarlo al recorrido') + '</i>');

            marcador.on('click', function () { alternarParada(c.id, enRuta); });
            marcador.addTo(capaRutas);
        });

        // --- Instalaciones ---
        cacheInstRutas.forEach(function (i) {
            if (i.lat === null || i.lng === null) return;
            const esDestino = r && r.instalacionId === i.id;

            const marcador = L.marker([i.lat, i.lng], {
                icon: iconoInstalacion(colorTipoInstalacion(i.tipo), esDestino),
                zIndexOffset: esDestino ? 600 : 100,
            });

            marcador.bindPopup('<b>' + i.nombre + '</b><br>' + i.tipoLegible +
                '<br>' + i.direccion +
                '<br><i>' + (esDestino ? 'Destino de esta ruta — click para quitarlo'
                                       : 'Click para fijarlo como destino') + '</i>');

            marcador.on('click', function () { fijarDestino(i.id, esDestino); });
            marcador.addTo(capaRutas);
        });

        // --- Trayecto ---
        if (r && ids.length > 0) {
            const puntos = [];
            ids.forEach(function (cid) {
                const c = cacheContRutas.find(function (x) { return x.id === cid; });
                if (c && c.lat !== null && c.lng !== null) puntos.push([c.lat, c.lng]);
            });

            const dest = cacheInstRutas.find(function (x) { return x.id === r.instalacionId; });
            const puntoDest = (dest && dest.lat !== null) ? [dest.lat, dest.lng] : null;

            // Primero dibujamos las líneas rectas: se ven al instante mientras
            // OSRM calcula el trayecto real por las calles, que lo reemplaza.
            if (puntos.length > 1) {
                L.polyline(puntos, { color: '#1b8536', weight: 2, opacity: 0.3, dashArray: '4 6' })
                    .addTo(capaTrayecto);
            }
            if (puntoDest && puntos.length > 0) {
                L.polyline([puntos[puntos.length - 1], puntoDest],
                           { color: '#0d8ecf', weight: 2, opacity: 0.3, dashArray: '4 6' })
                    .addTo(capaTrayecto);
            }

            trazarPorCalles(puntos, puntoDest);
        }
    }

    // =============================================================
    //  TRAYECTO REAL POR LAS CALLES (OSRM)
    //  Las líneas rectas entre paradas no muestran el recorrido que
    //  realmente hace el camión. OSRM (Open Source Routing Machine) es un
    //  servicio libre que, dada una lista de puntos, devuelve el camino por
    //  calles. Usamos su servidor público, que no pide registro ni clave.
    // =============================================================
    const OSRM = 'https://router.project-osrm.org/route/v1/driving/';
    let pedidoTrazado = 0;   // descarta respuestas viejas (ver abajo)

    /**
     * Pide a OSRM el camino que une una lista de puntos y devuelve
     * { coords, distancia, duracion }, o null si no se pudo calcular.
     * coords viene listo para Leaflet (en [lat, lng]).
     */
    async function pedirTrazado(puntos) {
        if (puntos.length < 2) return null;
        // OSRM espera los pares como "lng,lat" separados por punto y coma,
        // al revés de como los maneja Leaflet.
        const coords = puntos.map(function (p) { return p[1] + ',' + p[0]; }).join(';');
        try {
            const resp = await fetch(OSRM + coords + '?overview=full&geometries=geojson');
            if (!resp.ok) return null;
            const datos = await resp.json();
            if (datos.code !== 'Ok' || !datos.routes || datos.routes.length === 0) return null;
            const ruta = datos.routes[0];
            return {
                // GeoJSON da [lng, lat]: lo damos vuelta para Leaflet.
                coords: ruta.geometry.coordinates.map(function (c) { return [c[1], c[0]]; }),
                distancia: ruta.distance,   // metros
                duracion: ruta.duration,    // segundos
            };
        } catch (e) {
            return null;   // sin internet o servicio caído
        }
    }

    /**
     * Dibuja el recorrido siguiendo las calles: un trazo verde por las paradas
     * y uno celeste punteado hasta el destino. Si OSRM no responde, quedan
     * las líneas rectas que ya se dibujaron y se avisa en el resumen.
     */
    async function trazarPorCalles(puntos, puntoDest) {
        // Cada llamada se numera. Si el usuario toca varios contenedores
        // seguidos, las respuestas pueden llegar desordenadas; comparando
        // este número descartamos las que quedaron viejas.
        const miPedido = ++pedidoTrazado;

        const tramoParadas = await pedirTrazado(puntos);
        const tramoDestino = (puntoDest && puntos.length > 0)
            ? await pedirTrazado([puntos[puntos.length - 1], puntoDest])
            : null;

        // Llegó tarde: ya hay un trazado más nuevo en curso.
        if (miPedido !== pedidoTrazado || !capaTrayecto) return;

        let metros = 0, segundos = 0, falloAlguno = false;

        if (puntos.length > 1) {
            if (tramoParadas) {
                L.polyline(tramoParadas.coords,
                           { color: '#1b8536', weight: 5, opacity: 0.85 }).addTo(capaTrayecto);
                metros += tramoParadas.distancia;
                segundos += tramoParadas.duracion;
            } else {
                falloAlguno = true;
            }
        }

        if (puntoDest && puntos.length > 0) {
            if (tramoDestino) {
                L.polyline(tramoDestino.coords,
                           { color: '#0d8ecf', weight: 5, opacity: 0.85, dashArray: '12 8' })
                    .addTo(capaTrayecto);
                metros += tramoDestino.distancia;
                segundos += tramoDestino.duracion;
            } else {
                falloAlguno = true;
            }
        }

        mostrarResumenTrayecto(metros, segundos, falloAlguno);
    }

    /** Agrega al resumen la distancia y el tiempo estimado del recorrido. */
    function mostrarResumenTrayecto(metros, segundos, fallo) {
        const el = document.getElementById('rt-trayecto');
        if (!el) return;
        if (fallo) {
            el.innerHTML = '<span class="trayecto-aviso">No se pudo calcular el recorrido por ' +
                'calles (sin conexión o servicio no disponible). Se muestran líneas rectas.</span>';
            return;
        }
        if (metros === 0) { el.innerHTML = ''; return; }
        const km = (metros / 1000).toFixed(1);
        const min = Math.round(segundos / 60);
        el.innerHTML = '<span class="trayecto-ok">Recorrido por calles: <b>' + km + ' km</b>' +
            ' · tiempo estimado de manejo <b>' + min + ' min</b></span>';
    }

    // Suma o quita un contenedor del recorrido de la ruta activa.
    async function alternarParada(contenedorId, estaEnRuta) {
        if (rutaActivaId === null) { alert('Elegí primero qué ruta estás armando.'); return; }
        const endpoint = estaEnRuta ? '/rutas/quitar-contenedor' : '/rutas/agregar-contenedor';
        try {
            const resp = await fetch(API_RECOLECCION + endpoint, {
                method: 'POST', headers: cabeceras(),
                body: JSON.stringify({ rutaId: rutaActivaId, contenedorId: contenedorId }),
            });
            const res = await leerRespuesta(resp);
            if (res.ok) await refrescarRutas();
            else alert(textoError(res.datos, 'No se pudo modificar el recorrido.'));
        } catch (e) { alert('Error de conexión.'); }
    }

    // Fija (o quita) la instalación de destino de la ruta activa.
    async function fijarDestino(instalacionId, yaEsDestino) {
        if (rutaActivaId === null) { alert('Elegí primero qué ruta estás armando.'); return; }
        try {
            const resp = await fetch(API_RECOLECCION + '/rutas/asignar-destino', {
                method: 'POST', headers: cabeceras(),
                body: JSON.stringify({
                    rutaId: rutaActivaId,
                    instalacionId: yaEsDestino ? null : instalacionId,
                }),
            });
            const res = await leerRespuesta(resp);
            if (res.ok) await refrescarRutas();
            else alert(textoError(res.datos, 'No se pudo fijar el destino.'));
        } catch (e) { alert('Error de conexión.'); }
    }

    // Sube o baja una parada en el orden del recorrido.
    async function moverParada(contenedorId, direccion) {
        if (rutaActivaId === null) return;
        try {
            const resp = await fetch(API_RECOLECCION + '/rutas/mover-contenedor', {
                method: 'POST', headers: cabeceras(),
                body: JSON.stringify({
                    rutaId: rutaActivaId, contenedorId: contenedorId, direccion: direccion,
                }),
            });
            const res = await leerRespuesta(resp);
            if (res.ok) await refrescarRutas();
            // Si ya está en un extremo la API avisa con 400: no molestamos con alert.
        } catch (e) { alert('Error de conexión.'); }
    }

    // Vuelve a traer las rutas y redibuja el mapa SIN recrearlo
    // (así no parpadea ni se pierde el zoom donde estaba el usuario).
    async function refrescarRutas() {
        try {
            cacheRutas = await (await fetchGet(API_RECOLECCION + '/rutas')).json();
        } catch (e) { return; }
        llenarSelectorRutaActiva();
        dibujarMapaRutas();
        dibujarListaRutas();
    }

    // Lista ordenada de paradas de la ruta activa, con subir/bajar/quitar.
    function dibujarParadas() {
        const cont = document.getElementById('rt-paradas');
        const resumen = document.getElementById('rt-resumen');
        if (!cont) return;

        const r = rutaActiva();
        if (!r) {
            cont.innerHTML = '<p class="flota-vacia">Creá una ruta para empezar a armar su recorrido.</p>';
            if (resumen) resumen.textContent = '';
            return;
        }

        const ids = r.contenedores || [];
        const dest = cacheInstRutas.find(function (x) { return x.id === r.instalacionId; });

        if (resumen) {
            resumen.textContent = ids.length + ' parada(s)' +
                (dest ? ' · descarga en ' + dest.nombre : ' · sin destino asignado');
        }

        let filas;
        if (ids.length === 0) {
            filas = '<tr><td colspan="4" class="flota-vacia">Todavía no hay paradas. ' +
                    'Hacé click en los contenedores del mapa.</td></tr>';
        } else {
            filas = ids.map(function (cid, i) {
                const c = cacheContRutas.find(function (x) { return x.id === cid; });
                const nombre = c ? (c.codigo + ' — ' + c.direccion) : ('#' + cid);
                const arriba = i === 0 ? ' disabled' : '';
                const abajo  = i === ids.length - 1 ? ' disabled' : '';
                return '<tr><td><span class="orden-num">' + (i + 1) + '</span></td>' +
                    '<td>' + nombre + '</td>' +
                    '<td>' + (c ? textoLlenado(c.nivelLlenado) : '—') + '</td>' +
                    '<td class="col-acciones">' +
                    '<button class="btn-orden" onclick="moverParada(' + cid + ',-1)"' + arriba + ' title="Subir">&#9650;</button> ' +
                    '<button class="btn-orden" onclick="moverParada(' + cid + ',1)"' + abajo + ' title="Bajar">&#9660;</button> ' +
                    '<button class="btn-eliminar" onclick="alternarParada(' + cid + ', true)">Quitar</button>' +
                    '</td></tr>';
            }).join('');
        }

        // Fila final con el destino, para que el recorrido se lea completo.
        const filaDest = dest
            ? '<tr class="fila-destino"><td><span class="orden-fin">&#9873;</span></td>' +
              '<td><b>' + dest.nombre + '</b></td><td>' + dest.tipoLegible + '</td>' +
              '<td class="col-acciones"><button class="btn-eliminar" ' +
              'onclick="fijarDestino(' + dest.id + ', true)">Quitar destino</button></td></tr>'
            : '<tr class="fila-destino"><td><span class="orden-fin">&#9873;</span></td>' +
              '<td colspan="3" class="txt-muted">Sin destino: elegí una instalación en el mapa.</td></tr>';

        cont.innerHTML = '<table class="tabla"><thead><tr><th>Orden</th><th>Parada</th>' +
            '<th>Llenado</th><th>Acciones</th></tr></thead><tbody>' +
            filas + filaDest + '</tbody></table>';
    }

    async function cargarRutas() {
        const form = document.getElementById('form-ruta');
        if (form) form.onsubmit = altaRuta;

        try {
            cacheRutas      = await (await fetchGet(API_RECOLECCION + '/rutas')).json();
            cacheCuadrillas = await (await fetchGet(API_USUARIOS + '/cuadrillas')).json();
            cacheContRutas  = await (await fetchGet(API_GESTION + '/contenedores')).json();
            cacheInstRutas  = await (await fetchGet(API_GESTION + '/instalaciones')).json();
        } catch (e) {
            document.getElementById('panel-rutas').innerHTML =
                '<p class="flota-vacia">Error al conectar con las APIs.</p>';
            return;
        }

        // Selector de destino del formulario de alta.
        const selDest = document.getElementById('rt-destino');
        if (selDest) {
            selDest.innerHTML = '<option value="">(sin destino)</option>' +
                cacheInstRutas.map(function (i) {
                    return '<option value="' + i.id + '">' + i.nombre + ' (' + i.tipoLegible + ')</option>';
                }).join('');
        }

        // Mapa de armado del recorrido.
        prepararMapaRutas();

        // Selector de cuadrilla del formulario.
        const sel = document.getElementById('rt-cuadrilla');
        if (sel) {
            sel.innerHTML = '<option value="">(sin asignar)</option>' +
                cacheCuadrillas.map(function (c) {
                    return '<option value="' + c.id + '">' + c.nombre + '</option>';
                }).join('');
        }

        dibujarListaRutas();
    }

    // Tarjeta por ruta: datos, recorrido y destino. Se separó de cargarRutas()
    // para poder redibujarla sola cuando el mapa cambia algo.
    function dibujarListaRutas() {
        const cont = document.getElementById('panel-rutas');
        if (!cont) return;
        if (cacheRutas.length === 0) {
            cont.innerHTML = '<p class="flota-vacia">No hay rutas creadas todavía.</p>';
            return;
        }

        cont.innerHTML = cacheRutas.map(function (r) {
            // Cuadrilla responsable (selector para reasignar)
            const opcCuad = '<option value="">(sin asignar)</option>' +
                cacheCuadrillas.map(function (c) {
                    return '<option value="' + c.id + '"' +
                        (c.id === r.cuadrillaId ? ' selected' : '') + '>' + c.nombre + '</option>';
                }).join('');

            // Paradas del recorrido
            const ids = r.contenedores || [];
            let paradas;
            if (ids.length === 0) {
                paradas = '<tr><td colspan="4" class="flota-vacia">Sin contenedores en el recorrido</td></tr>';
            } else {
                paradas = ids.map(function (cid, i) {
                    const c = cacheContRutas.find(function (x) { return x.id === cid; });
                    if (!c) return '';
                    return '<tr><td>' + (i + 1) + '</td><td>' + c.codigo + '</td><td>' +
                        c.direccion + '</td><td>' +
                        '<button class="btn-eliminar" onclick="quitarDeRuta(' + r.id + ',' + cid + ')">Quitar</button>' +
                        '</td></tr>';
                }).join('');
            }

            // Destino final de la ruta (dónde descarga el camión).
            const dest = cacheInstRutas.find(function (x) { return x.id === r.instalacionId; });
            const agregar = '<p class="txt-muted flota-nota">' +
                (dest ? 'Descarga en <b>' + dest.nombre + '</b> (' + dest.tipoLegible + ').'
                      : 'Sin destino asignado.') +
                ' Para cambiar el recorrido, usá el mapa de arriba ' +
                '<a class="link-cuad" onclick="cambiarRutaActiva(' + r.id + ')">(editar esta ruta)</a>.</p>';

            return '<div class="flota-bloque">' +
                '<div class="flota-head"><h3>' + r.nombre + '</h3>' +
                '<span class="flota-zona">' + r.diaLegible + ' · ' + r.turno +
                (r.zona ? ' · ' + r.zona : '') + '</span>' +
                '<select onchange="asignarCuadrillaRuta(' + r.id + ', this.value)">' + opcCuad + '</select> ' +
                '<button class="btn-editar" onclick="editarRuta(' + r.id + ')">Editar</button> ' +
                '<button class="btn-eliminar" onclick="eliminarRuta(' + r.id + ')">Eliminar</button></div>' +
                '<table class="tabla"><thead><tr><th>#</th><th>Contenedor</th>' +
                '<th>Dirección</th><th>Acción</th></tr></thead><tbody>' + paradas + '</tbody></table>' +
                agregar + '</div>';
        }).join('');
    }

    async function altaRuta(e) {
        e.preventDefault();
        const msg = document.getElementById('rt-msg');
        msg.className = 'msg';
        const datos = {
            nombre:      document.getElementById('rt-nombre').value.trim(),
            zona:        document.getElementById('rt-zona').value,
            diaSemana:   document.getElementById('rt-dia').value,
            turno:       document.getElementById('rt-turno').value,
            cuadrillaId: document.getElementById('rt-cuadrilla').value,
            instalacionId: document.getElementById('rt-destino').value,
        };
        try {
            const resp = await fetch(API_RECOLECCION + '/rutas', {
                method: 'POST', headers: cabeceras(),
                body: JSON.stringify(datos),
            });
            const res = await leerRespuesta(resp);
            if (res.ok) {
                msg.textContent = 'Ruta creada.'; msg.classList.add('ok');
                e.target.reset(); recargarSeccionActual();
            } else {
                msg.textContent = textoError(res.datos, 'No se pudo crear.');
                msg.classList.add('err');
            }
        } catch (err) { msg.textContent = 'Error de conexión.'; msg.classList.add('err'); }
    }

    async function eliminarRuta(id) {
        if (!confirm('¿Eliminar esta ruta y su recorrido?')) return;
        await accionRuta('/rutas/eliminar', { id: id });
    }

    async function quitarDeRuta(rutaId, contenedorId) {
        await accionRuta('/rutas/quitar-contenedor',
                         { rutaId: rutaId, contenedorId: contenedorId });
    }

    async function asignarCuadrillaRuta(id, cuadrillaId) {
        const r = cacheRutas.find(function (x) { return x.id === id; });
        if (!r) return;
        await accionRuta('/rutas/modificar', {
            id: id, nombre: r.nombre, zona: r.zona,
            diaSemana: r.diaSemana, turno: r.turno,
            cuadrillaId: cuadrillaId || null,
        });
    }

    // Helper común: manda la acción y recarga la sección si salió bien.
    async function accionRuta(ruta, datos) {
        try {
            const resp = await fetch(API_RECOLECCION + ruta, {
                method: 'POST', headers: cabeceras(),
                body: JSON.stringify(datos),
            });
            const res = await leerRespuesta(resp);
            if (res.ok) recargarSeccionActual();
            else alert(textoError(res.datos, 'No se pudo completar la acción.'));
        } catch (e) { alert('Error de conexión.'); }
    }

    function editarRuta(id) {
        const r = cacheRutas.find(function (x) { return x.id === id; });
        if (!r) return;
        const sel = function (v, o) { return v === o ? ' selected' : ''; };
        const dias = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
        const nombresDias = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
        const cuerpo =
            '<div class="form-modal">'
            + '<label>Nombre</label><input type="text" id="e-rtnombre" value="' + r.nombre + '">'
            + '<label>Zona (municipio)</label><select id="e-rtzona">' + opcionesZona(r.zona) + '</select>'
            + '<label>Día</label><select id="e-rtdia">'
            + dias.map(function (d, i) {
                return '<option value="' + d + '"' + sel(r.diaSemana, d) + '>' + nombresDias[i] + '</option>';
              }).join('') + '</select>'
            + '<label>Turno</label><select id="e-rtturno">'
            + '<option value="matutino"' + sel(r.turno, 'matutino') + '>Matutino</option>'
            + '<option value="vespertino"' + sel(r.turno, 'vespertino') + '>Vespertino</option>'
            + '<option value="nocturno"' + sel(r.turno, 'nocturno') + '>Nocturno</option></select>'
            + '<button class="btn" id="modal-guardar">Guardar cambios</button></div>';

        abrirModal('Editar ruta', cuerpo, async function () {
            const datos = {
                id: id,
                nombre:    document.getElementById('e-rtnombre').value.trim(),
                zona:      document.getElementById('e-rtzona').value,
                diaSemana: document.getElementById('e-rtdia').value,
                turno:     document.getElementById('e-rtturno').value,
                cuadrillaId: r.cuadrillaId,
            };
            try {
                const resp = await fetch(API_RECOLECCION + '/rutas/modificar', {
                    method: 'POST', headers: cabeceras(),
                    body: JSON.stringify(datos),
                });
                const res = await leerRespuesta(resp);
                if (res.ok) { cerrarModal(); recargarSeccionActual(); }
                else modalError(textoError(res.datos, 'No se pudo modificar.'));
            } catch (e) { modalError('Error de conexión.'); }
        });
    }

    // =============================================================
    //  PANELES DE OPERARIO (bloque C de requerimientos 3.1.2.x)
    // =============================================================

    // Panel del operario de RECOLECCIÓN: su cuadrilla, su camión y sus rutas.
    async function panelRecoleccion() {
        const cont = document.getElementById('content');
        cont.innerHTML = '<div class="op-panel"><h2 class="op-titulo">Mi jornada</h2>' +
            '<p class="txt-muted">Cargando tu información…</p></div>';

        // El operario guarda el id de su cuadrilla en el campo "cuadrilla".
        const cuadrillaId = usuarioActual.cuadrilla ? parseInt(usuarioActual.cuadrilla) : null;
        let html = '<div class="op-panel"><h2 class="op-titulo">Mi jornada</h2>';

        if (cuadrillaId === null || isNaN(cuadrillaId)) {
            html += '<div class="op-aviso">Todavía no estás asignado a ninguna cuadrilla. ' +
                    'Consultá con la administración.</div></div>';
            cont.innerHTML = html;
            return;
        }

        // --- Cuadrilla y compañeros ---
        let cuadrilla = null, companeros = [];
        try {
            const cuads = await (await fetchGet(API_USUARIOS + '/cuadrillas')).json();
            cuadrilla = cuads.find(function (c) { return c.id === cuadrillaId; });
            const usuarios = await (await fetchGet(API_USUARIOS + '/usuarios')).json();
            if (cuadrilla) {
                companeros = (cuadrilla.operarios || [])
                    .filter(function (id) { return id !== usuarioActual.id; })
                    .map(function (id) {
                        const u = usuarios.find(function (x) { return x.id === id; });
                        return u ? u.nombre : ('#' + id);
                    });
            }
        } catch (e) {}

        html += '<div class="op-cards">';
        html += '<div class="op-card"><span class="material-icons-outlined">groups</span>' +
                '<h3>Mi cuadrilla</h3><p class="op-dato">' +
                (cuadrilla ? cuadrilla.nombre : 'Sin datos') + '</p>' +
                '<p class="txt-muted">' + (cuadrilla && cuadrilla.zona ? cuadrilla.zona : '') + '</p>' +
                (companeros.length
                    ? '<p class="txt-muted">Compañeros: ' + companeros.join(', ') + '</p>'
                    : '<p class="txt-muted">Sos el único integrante</p>') +
                '</div>';

        // --- Camión asignado a la cuadrilla (3.1.2.1.2) ---
        let camion = null;
        try {
            const camiones = await (await fetchGet(API_RECOLECCION + '/camiones')).json();
            camion = camiones.find(function (k) { return k.cuadrillaId === cuadrillaId; });
        } catch (e) {}

        html += '<div class="op-card"><span class="material-icons-outlined">local_shipping</span>' +
                '<h3>Mi camión</h3>';
        if (camion) {
            html += '<p class="op-dato">' + camion.patente + '</p>' +
                    '<p class="txt-muted">' + camion.modelo + '</p>' +
                    '<p>' + etiquetaEstadoCamion(camion.estado) + ' ' +
                    etiquetaDisponibilidad(camion.disponibilidad) + '</p>';
        } else {
            html += '<p class="txt-muted">No hay ningún camión asignado a tu cuadrilla.</p>';
        }
        html += '</div></div>';

        // --- Rutas asignadas (3.1.2.1.1) ---
        html += '<h2 class="sec-titulo">Mis rutas de recolección</h2><div id="op-rutas">' +
                '<p class="txt-muted">Cargando rutas…</p></div>';
        html += '</div>';
        cont.innerHTML = html;

        // Dibujar las rutas con su recorrido de contenedores.
        try {
            const rutas = await (await fetchGet(API_RECOLECCION + '/rutas/cuadrilla?id=' + cuadrillaId)).json();
            const contenedores = await (await fetchGet(API_GESTION + '/contenedores')).json();
            const divRutas = document.getElementById('op-rutas');
            if (rutas.length === 0) {
                divRutas.innerHTML = '<p class="flota-vacia">Todavía no tenés rutas asignadas.</p>';
            } else {
                divRutas.innerHTML = rutas.map(function (r) {
                    const paradas = (r.contenedores || []).map(function (cid, i) {
                        const c = contenedores.find(function (x) { return x.id === cid; });
                        if (!c) return '';
                        return '<li><b>' + (i + 1) + '.</b> ' + c.codigo + ' — ' + c.direccion +
                               ' ' + etiquetaLlenado(c.nivelLlenado) + '</li>';
                    }).join('');
                    return '<div class="op-ruta">' +
                        '<div class="op-ruta-cab"><h3>' + r.nombre + '</h3>' +
                        '<span class="pill pill-ok">' + r.diaLegible + '</span> ' +
                        '<span class="pill pill-warn">' + r.turno + '</span>' +
                        (r.zona ? '<span class="txt-muted">' + r.zona + '</span>' : '') + '</div>' +
                        (paradas
                            ? '<ol class="op-paradas">' + paradas + '</ol>'
                            : '<p class="txt-muted">Esta ruta todavía no tiene contenedores cargados.</p>') +
                        '</div>';
                }).join('');
            }
        } catch (e) {
            document.getElementById('op-rutas').innerHTML =
                '<p class="flota-vacia">No se pudieron cargar las rutas.</p>';
        }
    }

    function etiquetaEstadoCamion(estado) {
        const clase = (estado === 'mantenimiento') ? 'warn' : 'ok';
        const texto = (estado === 'mantenimiento') ? 'En mantenimiento' : 'Operativo';
        return '<span class="pill pill-' + clase + '">' + texto + '</span>';
    }

    function etiquetaDisponibilidad(disp) {
        const clase = (disp === 'en_ruta') ? 'warn' : 'ok';
        const texto = (disp === 'en_ruta') ? 'En ruta' : 'Disponible';
        return '<span class="pill pill-' + clase + '">' + texto + '</span>';
    }

    // Panel común de CLASIFICACIÓN y VERTEDERO: su instalación + inventario.
    // Cambia solo el texto según la especialidad (requerimientos 3.1.2.2.x y 3.1.2.3.x).
    async function panelInstalacion(especialidad) {
        const cont = document.getElementById('content');
        const esVertedero = (especialidad === 'vertedero');
        const titulo = esVertedero ? 'Mi vertedero' : 'Mi planta de clasificación';

        let html = '<div class="op-panel"><h2 class="op-titulo">' + titulo + '</h2>';

        const instId = usuarioActual.instalacionId || null;
        if (!instId) {
            html += '<div class="op-aviso">Todavía no estás asignado a ninguna instalación. ' +
                    'Consultá con la administración.</div></div>';
            cont.innerHTML = html;
            return;
        }

        let inst = null, items = [];
        try {
            const insts = await (await fetchGet(API_GESTION + '/instalaciones')).json();
            inst = insts.find(function (x) { return x.id === instId; });
            const maq = await (await fetchGet(API_GESTION + '/maquinaria')).json();
            items = maq.filter(function (m) { return m.instalacionId === instId; });
        } catch (e) {}

        if (!inst) {
            html += '<div class="op-aviso">No se encontró tu instalación asignada.</div></div>';
            cont.innerHTML = html;
            return;
        }

        // --- Estado e información de la instalación ---
        const pct = inst.porcentaje || 0;
        const claseBarra = pct >= 90 ? 'bad' : (pct >= 70 ? 'warn' : 'ok');

        html += '<div class="op-cards">';
        html += '<div class="op-card ancho"><span class="material-icons-outlined">factory</span>' +
                '<h3>' + inst.nombre + '</h3>' +
                '<p class="txt-muted">' + inst.direccion + '</p>' +
                '<p>' + etiquetaEstadoInstalacion(inst.estado) + '</p>' +
                '<p class="txt-muted">Procesa residuos: <b>' + inst.tipoResiduo + '</b></p>' +
                '</div>';

        html += '<div class="op-card ancho"><span class="material-icons-outlined">donut_large</span>' +
                '<h3>' + (esVertedero ? 'Capacidad y llenado' : 'Ocupación actual') + '</h3>' +
                '<p class="op-dato">' + inst.ocupacionActual + ' / ' + inst.capacidadMaxima + ' t</p>' +
                '<div class="barra"><div class="barra-relleno barra-' + claseBarra +
                '" style="width:' + Math.min(pct, 100) + '%"></div></div>' +
                '<p class="txt-muted">' + pct + '% de la capacidad' +
                (pct >= 90 ? ' — <b>capacidad crítica</b>' : (pct >= 70 ? ' — se acerca al límite' : '')) +
                '</p></div>';
        html += '</div>';

        // --- Inventario de maquinaria (3.1.2.2.2 y 3.1.2.3.2) ---
        html += '<h2 class="sec-titulo">' +
                (esVertedero ? 'Maquinaria pesada asignada' : 'Maquinaria y herramientas') + '</h2>';
        if (items.length === 0) {
            html += '<p class="flota-vacia">No hay equipamiento registrado en tu instalación.</p>';
        } else {
            html += '<table class="tabla"><thead><tr><th>Ítem</th><th>Categoría</th>' +
                    '<th>Cantidad</th><th>Estado</th></tr></thead><tbody>' +
                    items.map(function (m) {
                        return '<tr><td>' + m.nombre + '</td><td>' + m.categoria + '</td><td>' +
                               m.cantidad + '</td><td>' + etiquetaEstado(m.estado) + '</td></tr>';
                    }).join('') + '</tbody></table>';
        }

        html += '<div class="op-nota">¿Detectaste un problema en un contenedor? ' +
                'Reportalo desde la sección <b>Incidencias</b>.</div>';
        html += '</div>';
        cont.innerHTML = html;
    }

    function etiquetaEstadoInstalacion(estado) {
        const clases = { operativa: 'ok', mantenimiento: 'warn', fuera_servicio: 'bad' };
        const textos = { operativa: 'Operativa', mantenimiento: 'En mantenimiento',
                         fuera_servicio: 'Fuera de servicio' };
        return '<span class="pill pill-' + (clases[estado] || 'ok') + '">' +
               (textos[estado] || estado) + '</span>';
    }

    // =============================================================
    //  INCIDENCIAS (mapa para todos + gestión para el admin)
    // =============================================================
    let mapaInc = null, capaPinesInc = null;
    let contenedorElegido = null;      // el contenedor clickeado en el mapa
    let cacheContenedores = [];
    let cacheIncidencias = [];

    async function cargarIncidencias() {
        const esAdmin = rolEfectivo(usuarioActual) === 'administrador';

        if (typeof L === 'undefined') {
            const div = document.getElementById('mapa-incidencias');
            if (div) div.outerHTML = '<div class="mapa-error">No se pudo cargar el mapa. ' +
                'Verificá tu conexión a internet.</div>';
        } else {
            setTimeout(function () {
                if (document.getElementById('mapa-incidencias') && !mapaInc) {
                    mapaInc = L.map('mapa-incidencias').setView(MVD, 12);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap', maxZoom: 19,
                    }).addTo(mapaInc);
                    capaPinesInc = L.layerGroup().addTo(mapaInc);
                }
                refrescarMapaIncidencias();
                setTimeout(function () { if (mapaInc) mapaInc.invalidateSize(); }, 250);
            }, 100);
        }

        // El admin necesita las cuadrillas para poder asignar responsables.
        if (esAdmin && cacheCuadrillas.length === 0) {
            try { cacheCuadrillas = await (await fetchGet(API_USUARIOS + '/cuadrillas')).json(); } catch (e) {}
        }
        refrescarListaIncidencias();
        if (esAdmin) refrescarHistorial();
    }

    // Dibuja los contenedores en el mapa, marcando los que tienen incidencias.
    async function refrescarMapaIncidencias() {
        try {
            cacheContenedores = await (await fetchGet(API_GESTION + '/contenedores')).json();
            cacheIncidencias  = await (await fetchGet(API_GESTION + '/incidencias')).json();
        } catch (err) { return; }

        if (!capaPinesInc) return;
        capaPinesInc.clearLayers();

        cacheContenedores.forEach(function (c) {
            if (c.lat === null || c.lng === null) return;
            // ¿Este contenedor tiene incidencias activas?
            const suyas = cacheIncidencias.filter(function (i) { return i.contenedorId === c.id; });
            const conProblema = suyas.length > 0;

            const marcador = L.marker([c.lat, c.lng], {
                icon: iconoPinIncidencia(colorEstado(c.estado), conProblema)
            });

            let popup = '<b>' + c.codigo + '</b><br>' + c.direccion +
                        '<br>Tipo: ' + c.tipoResiduo +
                        '<br>Estado: ' + (c.estado === 'roto' ? 'Roto' : 'Operativo') +
                        '<br>Llenado: ' + textoLlenado(c.nivelLlenado);
            if (conProblema) {
                popup += '<br><b style="color:#c62828">' + suyas.length +
                         ' problema(s) reportado(s)</b>';
            }
            popup += '<br><i>Click en el pin para seleccionarlo</i>';

            marcador.bindPopup(popup);
            marcador.on('click', function () { elegirContenedor(c.id); });
            marcador.addTo(capaPinesInc);
        });
    }

    // Pin con anillo rojo si el contenedor tiene incidencias abiertas.
    function iconoPinIncidencia(color, conProblema) {
        const borde = conProblema ? '3px solid #c62828' : '2px solid #fff';
        const tam = conProblema ? 22 : 18;
        return L.divIcon({
            className: 'pin-cont',
            html: '<span style="background:' + color + '; border:' + borde +
                  '; width:' + tam + 'px; height:' + tam + 'px"></span>',
            iconSize: [tam, tam],
            iconAnchor: [tam / 2, tam / 2],
        });
    }

    // Al clickear un contenedor en el mapa queda seleccionado para reportar.
    function elegirContenedor(id) {
        contenedorElegido = id;
        const c = cacheContenedores.find(function (x) { return x.id === id; });
        const span = document.getElementById('cont-elegido');
        const btn  = document.getElementById('btn-reportar');
        if (span && c) {
            span.textContent = 'Seleccionado: ' + c.codigo + ' — ' + c.direccion;
            span.className = 'cont-ok';
        }
        if (btn) btn.disabled = false;
    }

    // Modal para describir el problema.
    function abrirReporte() {
        if (contenedorElegido === null) { alert('Elegí un contenedor en el mapa.'); return; }
        const c = cacheContenedores.find(function (x) { return x.id === contenedorElegido; });
        const cuerpo =
            '<div class="form-modal">'
            + '<p class="txt-muted">Contenedor: <b>' + (c ? c.codigo + ' — ' + c.direccion : '') + '</b></p>'
            + '<label>Tipo de problema</label><select id="r-tipo">'
            + '<option value="desborde">Desborde</option>'
            + '<option value="rotura">Rotura</option>'
            + '<option value="falta_recoleccion">Falta de recolección</option>'
            + '<option value="otro">Otro</option></select>'
            + '<label>Gravedad</label><select id="r-gravedad">'
            + '<option value="baja">Baja</option>'
            + '<option value="media" selected>Media</option>'
            + '<option value="alta">Alta</option></select>'
            + '<label>Descripción del problema</label>'
            + '<textarea id="r-descripcion" rows="3" placeholder="Contanos brevemente qué pasa..."></textarea>'
            + '<button class="btn" id="modal-guardar">Enviar reporte</button></div>';

        abrirModal('Reportar un problema', cuerpo, async function () {
            const datos = {
                contenedorId:       contenedorElegido,
                tipo:               document.getElementById('r-tipo').value,
                gravedad:           document.getElementById('r-gravedad').value,
                descripcion:        document.getElementById('r-descripcion').value.trim(),
                reportadoPor:       usuarioActual ? usuarioActual.id : null,
                reportadoPorNombre: usuarioActual ? usuarioActual.nombre : 'Anónimo',
            };
            try {
                const resp = await fetch(API_GESTION + '/incidencias', {
                    method: 'POST', headers: cabeceras(),
                    body: JSON.stringify(datos),
                });
                const r = await resp.json();
                if (resp.ok) { cerrarModal(); recargarSeccionActual(); }
                else modalError(r.error || 'No se pudo reportar.');
            } catch (e) { modalError('Error de conexión.'); }
        });
    }

    // Lista de incidencias activas. El admin ve controles de gestión.
    async function refrescarListaIncidencias() {
        const cont = document.getElementById('lista-incidencias');
        if (!cont) return;
        const esAdmin = rolEfectivo(usuarioActual) === 'administrador';

        try {
            cacheIncidencias = await (await fetchGet(API_GESTION + '/incidencias')).json();
            if (cacheContenedores.length === 0) {
                cacheContenedores = await (await fetchGet(API_GESTION + '/contenedores')).json();
            }
        } catch (err) {
            cont.innerHTML = '<p class="flota-vacia">Error al conectar con API Gestión.</p>';
            return;
        }

        if (cacheIncidencias.length === 0) {
            cont.innerHTML = '<p class="flota-vacia">No hay incidencias activas. Todo en orden.</p>';
            return;
        }

        const filas = cacheIncidencias.map(function (i) {
            const c = cacheContenedores.find(function (x) { return x.id === i.contenedorId; });
            const cont_txt = c ? (c.codigo + ' — ' + c.direccion) : ('#' + i.contenedorId);

            let acciones = '';
            if (esAdmin) {
                // Selector de estado
                const est = ['abierta', 'en_curso'].map(function (e) {
                    const t = (e === 'abierta') ? 'Abierta' : 'En curso';
                    return '<option value="' + e + '"' + (i.estado === e ? ' selected' : '') + '>' + t + '</option>';
                }).join('');
                // Selector de cuadrilla responsable
                const cuad = '<option value="">(sin asignar)</option>' +
                    cacheCuadrillas.map(function (cu) {
                        return '<option value="' + cu.id + '"' +
                            (cu.id === i.cuadrillaId ? ' selected' : '') + '>' + cu.nombre + '</option>';
                    }).join('');
                acciones =
                    '<select onchange="cambiarEstadoIncidencia(' + i.id + ', this.value)">' + est + '</select> ' +
                    '<select onchange="asignarCuadrillaIncidencia(' + i.id + ', this.value)">' + cuad + '</select> ' +
                    '<button class="btn-mini" onclick="resolverIncidencia(' + i.id + ')">Resolver</button> ' +
                    '<button class="btn-eliminar" onclick="eliminarIncidencia(' + i.id + ')">Eliminar</button>';
            } else {
                acciones = '<span class="txt-muted">' +
                    (i.estado === 'en_curso' ? 'La cuadrilla está trabajando en esto' : 'Pendiente de atención') +
                    '</span>';
            }

            return '<tr><td>' + pillGravedad(i.gravedad) + '</td><td>' + i.tipoLegible + '</td><td>' +
                cont_txt + '</td><td>' + i.descripcion + '</td><td>' + i.reportadoPorNombre + '</td><td>' +
                (i.fechaReporte || '').substring(0, 16) + '</td><td>' + acciones + '</td></tr>';
        }).join('');

        cont.innerHTML = '<table class="tabla"><thead><tr><th>Gravedad</th><th>Tipo</th>' +
            '<th>Contenedor</th><th>Descripción</th><th>Reportó</th><th>Fecha</th>' +
            '<th>' + (esAdmin ? 'Gestión' : 'Estado') + '</th></tr></thead><tbody>' +
            filas + '</tbody></table>';
    }

    // Historial de incidencias resueltas (solo admin).
    async function refrescarHistorial() {
        const cont = document.getElementById('historial-incidencias');
        if (!cont) return;
        try {
            const lista = await (await fetchGet(API_GESTION + '/incidencias/historial')).json();
            if (lista.length === 0) {
                cont.innerHTML = '<p class="flota-vacia">Todavía no hay incidencias resueltas.</p>';
                return;
            }
            const filas = lista.map(function (i) {
                const c = cacheContenedores.find(function (x) { return x.id === i.contenedorId; });
                const cuad = i.cuadrillaId ? nombreCuadrilla(i.cuadrillaId) : '—';
                return '<tr><td>' + pillGravedad(i.gravedad) + '</td><td>' + i.tipoLegible + '</td><td>' +
                    (c ? c.codigo : '#' + i.contenedorId) + '</td><td>' + i.descripcion + '</td><td>' +
                    cuad + '</td><td>' + (i.fechaReporte || '').substring(0, 16) + '</td><td>' +
                    (i.fechaResolucion || '').substring(0, 16) + '</td></tr>';
            }).join('');
            cont.innerHTML = '<table class="tabla"><thead><tr><th>Gravedad</th><th>Tipo</th>' +
                '<th>Contenedor</th><th>Descripción</th><th>Cuadrilla</th><th>Reportada</th>' +
                '<th>Resuelta</th></tr></thead><tbody>' + filas + '</tbody></table>';
        } catch (err) {
            cont.innerHTML = '<p class="flota-vacia">Error al cargar el historial.</p>';
        }
    }

    function pillGravedad(g) {
        const clase = (g === 'alta') ? 'bad' : (g === 'media' ? 'warn' : 'ok');
        const texto = (g === 'alta') ? 'Alta' : (g === 'media' ? 'Media' : 'Baja');
        return '<span class="pill pill-' + clase + '">' + texto + '</span>';
    }

    async function cambiarEstadoIncidencia(id, estado) {
        try {
            const resp = await fetch(API_GESTION + '/incidencias/estado', {
                method: 'POST', headers: cabeceras(),
                body: JSON.stringify({ id: id, estado: estado }),
            });
            if (resp.ok) recargarSeccionActual();
            else { const r = await resp.json(); alert(r.error || 'No se pudo cambiar el estado.'); }
        } catch (e) { alert('Error de conexión.'); }
    }

    async function asignarCuadrillaIncidencia(id, cuadrillaId) {
        try {
            const resp = await fetch(API_GESTION + '/incidencias/asignar-cuadrilla', {
                method: 'POST', headers: cabeceras(),
                body: JSON.stringify({ id: id, cuadrillaId: cuadrillaId || null }),
            });
            if (!resp.ok) { const r = await resp.json(); alert(r.error || 'No se pudo asignar.'); }
        } catch (e) { alert('Error de conexión.'); }
    }

    // Resolver: marca resuelta y la manda al historial (sale del mapa activo).
    async function resolverIncidencia(id) {
        if (!confirm('¿Marcar esta incidencia como resuelta? Pasará al historial.')) return;
        try {
            const resp = await fetch(API_GESTION + '/incidencias/estado', {
                method: 'POST', headers: cabeceras(),
                body: JSON.stringify({ id: id, estado: 'resuelta' }),
            });
            if (resp.ok) recargarSeccionActual();
            else { const r = await resp.json(); alert(r.error || 'No se pudo resolver.'); }
        } catch (e) { alert('Error de conexión.'); }
    }

    async function eliminarIncidencia(id) {
        if (!confirm('¿Eliminar esta incidencia definitivamente?')) return;
        try {
            const resp = await fetch(API_GESTION + '/incidencias/eliminar', {
                method: 'POST', headers: cabeceras(),
                body: JSON.stringify({ id: id }),
            });
            if (resp.ok) recargarSeccionActual();
            else { const r = await resp.json(); alert(r.error || 'No se pudo eliminar.'); }
        } catch (e) { alert('Error de conexión.'); }
    }

    // =============================================================
    //  INSTALACIONES (centros de acopio, plantas y vertederos)
    //  y su INVENTARIO de maquinaria
    // =============================================================
    let cacheInstalaciones = [];
    let mapaInstCrear = null, mapaInstListado = null;
    let marcadorInstNuevo = null, capaPinesInst = null;
    let coordInstNueva = { lat: null, lng: null };

    // Color del pin según el tipo de instalación.
    function colorTipoInstalacion(tipo) {
        if (tipo === 'clasificacion') return '#8e24aa';  // violeta
        if (tipo === 'vertedero')     return '#6d4c41';  // marrón
        return '#0d8ecf';                                // celeste: acopio
    }

    async function cargarInstalaciones() {
        const tbody = document.getElementById('tabla-instalaciones');
        if (!tbody) return;

        // --- Mapas (si Leaflet cargó) ---
        if (typeof L !== 'undefined') {
            setTimeout(function () {
                // Mapa para elegir la ubicación de la instalación nueva.
                if (document.getElementById('mapa-inst-crear') && !mapaInstCrear) {
                    mapaInstCrear = L.map('mapa-inst-crear').setView(MVD, 12);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap', maxZoom: 19,
                    }).addTo(mapaInstCrear);
                    mapaInstCrear.on('click', function (e) {
                        coordInstNueva.lat = e.latlng.lat;
                        coordInstNueva.lng = e.latlng.lng;
                        if (marcadorInstNuevo) marcadorInstNuevo.setLatLng(e.latlng);
                        else marcadorInstNuevo = L.marker(e.latlng).addTo(mapaInstCrear);
                        const c = document.getElementById('i-coord');
                        if (c) c.textContent = 'Ubicación: ' +
                            e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5);
                    });
                }
                // Mapa con todas las instalaciones.
                if (document.getElementById('mapa-inst-listado') && !mapaInstListado) {
                    mapaInstListado = L.map('mapa-inst-listado').setView(MVD, 11);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap', maxZoom: 19,
                    }).addTo(mapaInstListado);
                    capaPinesInst = L.layerGroup().addTo(mapaInstListado);
                }
                dibujarPinesInstalaciones();
                setTimeout(function () {
                    if (mapaInstCrear) mapaInstCrear.invalidateSize();
                    if (mapaInstListado) mapaInstListado.invalidateSize();
                }, 250);
            }, 100);
        }

        try {
            cacheInstalaciones = await (await fetchGet(API_GESTION + '/instalaciones')).json();
            tbody.innerHTML = cacheInstalaciones.map(function (i) {
                return '<tr><td>' + i.id + '</td><td>' + i.nombre + '</td><td>' +
                    i.tipoLegible + '</td><td>' + i.direccion + '</td><td>' +
                    i.capacidadMaxima + ' t</td><td>' + i.tipoResiduo + '</td><td>' +
                    etiquetaEstado(i.estado) + '</td><td>' +
                    '<button class="btn-editar" onclick="editarInstalacion(' + i.id + ')">Editar</button> ' +
                    '<button class="btn-eliminar" onclick="eliminarInstalacion(' + i.id + ')">Eliminar</button>' +
                    '</td></tr>';
            }).join('');
            if (cacheInstalaciones.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="txt-muted">No hay instalaciones registradas.</td></tr>';
            }
            dibujarPinesInstalaciones();
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="8">Error al conectar con API Gestión.</td></tr>';
        }

        // Selector de instalación del formulario de inventario.
        const sel = document.getElementById('m-instalacion');
        if (sel) {
            sel.innerHTML = cacheInstalaciones.length
                ? cacheInstalaciones.map(function (i) {
                    return '<option value="' + i.id + '">' + i.nombre + ' (' + i.tipoLegible + ')</option>';
                  }).join('')
                : '<option value="">(creá una instalación primero)</option>';
        }

        const formI = document.getElementById('form-instalacion');
        if (formI) formI.onsubmit = altaInstalacion;
        const formM = document.getElementById('form-maquinaria');
        if (formM) formM.onsubmit = altaMaquinaria;

        cargarInventario();
    }

    // Dibuja un pin por instalación, de color según su tipo.
    function dibujarPinesInstalaciones() {
        if (!capaPinesInst) return;
        capaPinesInst.clearLayers();
        cacheInstalaciones.forEach(function (i) {
            if (i.lat === null || i.lng === null) return;
            L.marker([i.lat, i.lng], { icon: iconoPin(colorTipoInstalacion(i.tipo)) })
                .bindPopup('<b>' + i.nombre + '</b><br>' + i.tipoLegible + '<br>' +
                           i.direccion + '<br>Capacidad: ' + i.capacidadMaxima + ' t' +
                           '<br>Estado: ' + i.estado)
                .addTo(capaPinesInst);
        });
    }

    // Traduce el estado a una etiqueta de color.
    function etiquetaEstado(estado) {
        const clases = { operativa: 'ok', operativo: 'ok', mantenimiento: 'warn',
                         fuera_servicio: 'bad', rota: 'bad' };
        const textos = { operativa: 'Operativa', mantenimiento: 'Mantenimiento',
                         fuera_servicio: 'Fuera de servicio', rota: 'Rota' };
        return '<span class="pill pill-' + (clases[estado] || 'ok') + '">' +
               (textos[estado] || estado) + '</span>';
    }

    async function altaInstalacion(e) {
        e.preventDefault();
        const msg = document.getElementById('i-msg');
        msg.className = 'msg';
        if (coordInstNueva.lat === null || coordInstNueva.lng === null) {
            msg.textContent = 'Marcá la ubicación en el mapa antes de agregar.';
            msg.classList.add('err');
            return;
        }
        const datos = {
            nombre:          document.getElementById('i-nombre').value.trim(),
            direccion:       document.getElementById('i-direccion').value.trim(),
            tipo:            document.getElementById('i-tipo').value,
            capacidadMaxima: document.getElementById('i-capacidad').value,
            tipoResiduo:     document.getElementById('i-residuo').value,
            estado:          document.getElementById('i-estado').value,
            lat:             coordInstNueva.lat,
            lng:             coordInstNueva.lng,
        };
        try {
            const resp = await fetch(API_GESTION + '/instalaciones', {
                method: 'POST',
                headers: cabeceras(),
                body: JSON.stringify(datos),
            });
            const r = await resp.json();
            if (resp.ok) {
                msg.textContent = 'Instalación creada.'; msg.classList.add('ok');
                e.target.reset();
                if (marcadorInstNuevo && mapaInstCrear) { mapaInstCrear.removeLayer(marcadorInstNuevo); }
                marcadorInstNuevo = null;
                coordInstNueva = { lat: null, lng: null };
                recargarSeccionActual();
            } else {
                msg.textContent = r.error; msg.classList.add('err');
            }
        } catch (err) {
            msg.textContent = 'Error de conexión.'; msg.classList.add('err');
        }
    }

    async function eliminarInstalacion(id) {
        if (!confirm('¿Eliminar esta instalación? Su inventario quedará sin asignar.')) return;
        try {
            const resp = await fetch(API_GESTION + '/instalaciones/eliminar', {
                method: 'POST',
                headers: cabeceras(),
                body: JSON.stringify({ id: id }),
            });
            if (resp.ok) recargarSeccionActual();
            else { const r = await resp.json(); alert(r.error || 'No se pudo eliminar.'); }
        } catch (err) { alert('Error de conexión.'); }
    }

    // Dibuja una tabla de inventario por cada instalación.
    async function cargarInventario() {
        const cont = document.getElementById('panel-inventario');
        if (!cont) return;
        try {
            const items = await (await fetchGet(API_GESTION + '/maquinaria')).json();

            let html = cacheInstalaciones.map(function (inst) {
                const suyos = items.filter(function (m) { return m.instalacionId === inst.id; });
                let filas;
                if (suyos.length === 0) {
                    filas = '<tr><td colspan="5" class="flota-vacia">Sin ítems registrados</td></tr>';
                } else {
                    filas = suyos.map(function (m) {
                        return '<tr><td>' + m.nombre + '</td><td>' + m.categoria + '</td><td>' +
                            m.cantidad + '</td><td>' + etiquetaEstado(m.estado) + '</td><td>' +
                            '<button class="btn-editar" onclick="editarMaquinaria(' + m.id + ')">Editar</button> ' +
                            '<button class="btn-eliminar" onclick="eliminarMaquinaria(' + m.id + ')">Eliminar</button>' +
                            '</td></tr>';
                    }).join('');
                }
                return '<div class="flota-bloque">' +
                    '<div class="flota-head"><h3>' + inst.nombre + '</h3>' +
                    '<span class="flota-zona">' + inst.tipoLegible + ' — capacidad ' +
                    inst.capacidadMaxima + ' t</span></div>' +
                    '<table class="tabla"><thead><tr><th>Ítem</th><th>Categoría</th>' +
                    '<th>Cantidad</th><th>Estado</th><th>Acción</th></tr></thead><tbody>' +
                    filas + '</tbody></table></div>';
            }).join('');

            // Ítems que quedaron sin instalación (por ejemplo, tras eliminar una).
            const huerfanos = items.filter(function (m) { return m.instalacionId === null; });
            if (huerfanos.length > 0) {
                html += '<div class="flota-bloque"><div class="flota-head">' +
                    '<h3>Sin instalación asignada</h3></div>' +
                    '<table class="tabla"><thead><tr><th>Ítem</th><th>Categoría</th>' +
                    '<th>Cantidad</th><th>Estado</th><th>Acción</th></tr></thead><tbody>' +
                    huerfanos.map(function (m) {
                        return '<tr><td>' + m.nombre + '</td><td>' + m.categoria + '</td><td>' +
                            m.cantidad + '</td><td>' + etiquetaEstado(m.estado) + '</td><td>' +
                            '<button class="btn-editar" onclick="editarMaquinaria(' + m.id + ')">Editar</button> ' +
                            '<button class="btn-eliminar" onclick="eliminarMaquinaria(' + m.id + ')">Eliminar</button>' +
                            '</td></tr>';
                    }).join('') + '</tbody></table></div>';
            }

            cont.innerHTML = html || '<p class="flota-vacia">Creá una instalación para cargar su inventario.</p>';
        } catch (err) {
            cont.innerHTML = '<p class="flota-vacia">Error al conectar con API Gestión.</p>';
        }
    }

    async function altaMaquinaria(e) {
        e.preventDefault();
        const msg = document.getElementById('m-msg');
        msg.className = 'msg';
        const datos = {
            nombre:        document.getElementById('m-nombre').value.trim(),
            categoria:     document.getElementById('m-categoria').value,
            estado:        document.getElementById('m-estado').value,
            cantidad:      document.getElementById('m-cantidad').value,
            instalacionId: document.getElementById('m-instalacion').value,
        };
        try {
            const resp = await fetch(API_GESTION + '/maquinaria', {
                method: 'POST',
                headers: cabeceras(),
                body: JSON.stringify(datos),
            });
            const res = await leerRespuesta(resp);
            if (res.ok) {
                msg.textContent = 'Ítem agregado al inventario.'; msg.classList.add('ok');
                e.target.reset(); recargarSeccionActual();
            } else {
                msg.textContent = textoError(res.datos, 'No se pudo agregar.');
                msg.classList.add('err');
            }
        } catch (err) {
            msg.textContent = 'Error de conexión.'; msg.classList.add('err');
        }
    }

    async function eliminarMaquinaria(id) {
        if (!confirm('¿Eliminar este ítem del inventario?')) return;
        try {
            const resp = await fetch(API_GESTION + '/maquinaria/eliminar', {
                method: 'POST',
                headers: cabeceras(),
                body: JSON.stringify({ id: id }),
            });
            if (resp.ok) recargarSeccionActual();
            else { const r = await resp.json(); alert(r.error || 'No se pudo eliminar.'); }
        } catch (err) { alert('Error de conexión.'); }
    }

    // =============================================================
    //  MODAL DE EDICIÓN (reutilizable)
    // =============================================================
    function abrirModal(titulo, htmlCuerpo, onGuardar) {
        document.getElementById('modal-titulo').textContent = titulo;
        document.getElementById('modal-cuerpo').innerHTML = htmlCuerpo;
        document.getElementById('modal-msg').textContent = '';
        document.getElementById('modal-msg').className = 'msg';
        document.getElementById('modal-editar').classList.remove('oculto');
        // El botón "Guardar" del cuerpo llama a la función que pasamos.
        const btn = document.getElementById('modal-guardar');
        if (btn) btn.onclick = onGuardar;
    }

    function cerrarModal() {
        document.getElementById('modal-editar').classList.add('oculto');
    }

    function modalError(texto) {
        const m = document.getElementById('modal-msg');
        m.textContent = texto; m.className = 'msg err';
    }

    // -------- EDITAR USUARIO --------
    function editarUsuario(id) {
        const u = cacheUsuarios.find(function (x) { return x.id === id; });
        if (!u) return;
        const esOperario = u.rol === 'operario';
        const cuerpo =
            '<div class="form-modal">'
            + '<label>Nombre</label><input type="text" id="e-nombre" value="' + (u.nombre || '') + '">'
            + '<label>Email</label><input type="email" id="e-email" value="' + (u.email || '') + '">'
            + '<label>Contraseña (dejar vacío para no cambiarla)</label><input type="password" id="e-password" placeholder="••••••">'
            + '<label>Rol</label><select id="e-rol" onchange="toggleEspecialidadEdit()">'
            + '<option value="vecino"' + (u.rol === 'vecino' ? ' selected' : '') + '>Vecino</option>'
            + '<option value="operario"' + (u.rol === 'operario' ? ' selected' : '') + '>Operario</option>'
            + '<option value="administrador"' + (u.rol === 'administrador' ? ' selected' : '') + '>Administrador</option>'
            + '</select>'
            + '<div id="e-wrap-esp" style="' + (esOperario ? '' : 'display:none;') + '">'
            + '<label>Especialidad</label><select id="e-especialidad">'
            + '<option value="recoleccion"' + (u.especialidad === 'recoleccion' ? ' selected' : '') + '>Recolección</option>'
            + '<option value="clasificacion"' + (u.especialidad === 'clasificacion' ? ' selected' : '') + '>Clasificación</option>'
            + '<option value="vertedero"' + (u.especialidad === 'vertedero' ? ' selected' : '') + '>Vertedero</option>'
            + '</select></div>'
            + '<button class="btn" id="modal-guardar">Guardar cambios</button></div>';

        abrirModal('Editar usuario', cuerpo, async function () {
            const datos = {
                id: id,
                nombre: document.getElementById('e-nombre').value.trim(),
                email: document.getElementById('e-email').value.trim(),
                password: document.getElementById('e-password').value,
                rol: document.getElementById('e-rol').value,
            };
            if (datos.rol === 'operario') datos.especialidad = document.getElementById('e-especialidad').value;
            try {
                const resp = await fetch(API_USUARIOS + '/usuarios/modificar', {
                    method: 'POST', headers: cabeceras(),
                    body: JSON.stringify(datos),
                });
                const r = await resp.json();
                if (resp.ok) { cerrarModal(); recargarSeccionActual(); }
                else modalError(r.error || 'No se pudo modificar.');
            } catch (e) { modalError('Error de conexión.'); }
        });
    }
    function toggleEspecialidadEdit() {
        const rol = document.getElementById('e-rol').value;
        document.getElementById('e-wrap-esp').style.display = (rol === 'operario') ? 'block' : 'none';
    }

    // -------- EDITAR CONTENEDOR --------
    let modalMapa = null, modalMarcador = null, modalCoord = { lat: null, lng: null };
    let modalMapaInst = null, modalMarcadorInst = null, modalCoordInst = { lat: null, lng: null };
    function editarContenedor(id) {
        // Buscamos el contenedor en la última lista cargada.
        fetchGet(API_GESTION + '/contenedores').then(function (resp) { return resp.json(); }).then(function (lista) {
            const c = lista.find(function (x) { return x.id === id; });
            if (!c) return;
            modalCoord = { lat: c.lat, lng: c.lng };
            const cuerpo =
                '<div class="form-modal">'
                + '<label>Código</label><input type="text" id="e-codigo" value="' + (c.codigo || '') + '">'
                + '<label>Dirección</label><input type="text" id="e-direccion" value="' + (c.direccion || '') + '">'
                + '<label>Zona (municipio)</label><select id="e-zona">' + opcionesZona(c.zona) + '</select>'
                + '<p class="zona-auto" id="e-zona-aviso">Si movés el punto en el mapa, la zona se recalcula.</p>'
                + '<label>Tipo de residuo</label><select id="e-tipo">'
                + '<option value="mezclado"' + (c.tipoResiduo === 'mezclado' ? ' selected' : '') + '>Mezclado</option>'
                + '<option value="reciclable"' + (c.tipoResiduo === 'reciclable' ? ' selected' : '') + '>Reciclable</option></select>'
                + '<label>Estado (integridad)</label><select id="e-estado">'
                + '<option value="operativo"' + (c.estado === 'operativo' ? ' selected' : '') + '>Operativo</option>'
                + '<option value="roto"' + (c.estado === 'roto' ? ' selected' : '') + '>Roto</option></select>'
                + '<label>Nivel de llenado</label><select id="e-llenado">'
                + '<option value="vacio"' + (c.nivelLlenado === 'vacio' ? ' selected' : '') + '>Vacío</option>'
                + '<option value="lleno"' + (c.nivelLlenado === 'lleno' ? ' selected' : '') + '>Lleno</option>'
                + '<option value="desbordado"' + (c.nivelLlenado === 'desbordado' ? ' selected' : '') + '>Desbordado</option></select>'
                + '<label>Ubicación (click en el mapa para cambiarla)</label>'
                + '<div id="modal-mapa" class="mapa"></div>'
                + '<p class="mapa-coord" id="e-coord">Ubicación actual: ' + c.lat + ', ' + c.lng + '</p>'
                + '<button class="btn" id="modal-guardar">Guardar cambios</button></div>';

            abrirModal('Editar contenedor', cuerpo, async function () {
                const datos = {
                    id: id,
                    codigo: document.getElementById('e-codigo').value.trim(),
                    direccion: document.getElementById('e-direccion').value.trim(),
                    zona: document.getElementById('e-zona').value,
                    tipoResiduo: document.getElementById('e-tipo').value,
                    estado: document.getElementById('e-estado').value,
                    nivelLlenado: document.getElementById('e-llenado').value,
                    lat: modalCoord.lat, lng: modalCoord.lng,
                };
                try {
                    const resp = await fetch(API_GESTION + '/contenedores/modificar', {
                        method: 'POST', headers: cabeceras(),
                        body: JSON.stringify(datos),
                    });
                    const r = await resp.json();
                    if (resp.ok) { cerrarModal(); refrescarContenedores(); }
                    else modalError(r.error || 'No se pudo modificar.');
                } catch (e) { modalError('Error de conexión.'); }
            });

            // Mini-mapa dentro del modal para reubicar.
            if (typeof L !== 'undefined') {
                setTimeout(function () {
                    modalMapa = L.map('modal-mapa').setView([c.lat || MVD[0], c.lng || MVD[1]], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(modalMapa);
                    if (c.lat && c.lng) modalMarcador = L.marker([c.lat, c.lng]).addTo(modalMapa);
                    modalMapa.on('click', function (e) {
                        modalCoord.lat = e.latlng.lat; modalCoord.lng = e.latlng.lng;
                        if (modalMarcador) modalMarcador.setLatLng(e.latlng);
                        else modalMarcador = L.marker(e.latlng).addTo(modalMapa);
                        document.getElementById('e-coord').textContent =
                            'Nueva ubicación: ' + e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5);
                        aplicarZonaAuto('e-zona', 'e-zona-aviso', e.latlng.lat, e.latlng.lng);
                    });
                    setTimeout(function () { modalMapa.invalidateSize(); }, 200);
                }, 100);
            }
        });
    }

    // -------- EDITAR INSTALACIÓN --------
    function editarInstalacion(id) {
        const i = cacheInstalaciones.find(function (x) { return x.id === id; });
        if (!i) return;
        const sel = function (valor, opcion) { return valor === opcion ? ' selected' : ''; };
        const cuerpo =
            '<div class="form-modal">'
            + '<label>Nombre</label><input type="text" id="e-inombre" value="' + i.nombre + '">'
            + '<label>Dirección</label><input type="text" id="e-idireccion" value="' + i.direccion + '">'
            + '<label>Tipo</label><select id="e-itipo">'
            + '<option value="acopio"' + sel(i.tipo, 'acopio') + '>Centro de acopio</option>'
            + '<option value="clasificacion"' + sel(i.tipo, 'clasificacion') + '>Planta de clasificación</option>'
            + '<option value="vertedero"' + sel(i.tipo, 'vertedero') + '>Vertedero</option></select>'
            + '<label>Capacidad máxima (toneladas)</label>'
            + '<input type="number" id="e-icapacidad" min="1" value="' + i.capacidadMaxima + '">'
            + '<label>Tipo de residuo</label><select id="e-iresiduo">'
            + '<option value="mezclado"' + sel(i.tipoResiduo, 'mezclado') + '>Mezclado</option>'
            + '<option value="reciclable"' + sel(i.tipoResiduo, 'reciclable') + '>Reciclable</option>'
            + '<option value="ambos"' + sel(i.tipoResiduo, 'ambos') + '>Ambos</option></select>'
            + '<label>Estado</label><select id="e-iestado">'
            + '<option value="operativa"' + sel(i.estado, 'operativa') + '>Operativa</option>'
            + '<option value="mantenimiento"' + sel(i.estado, 'mantenimiento') + '>Mantenimiento</option>'
            + '<option value="fuera_servicio"' + sel(i.estado, 'fuera_servicio') + '>Fuera de servicio</option></select>'
            + '<label>Ubicación (click en el mapa para cambiarla)</label>'
            + '<div id="modal-mapa-inst" class="mapa"></div>'
            + '<p class="mapa-coord" id="e-icoord">Ubicación actual: ' + i.lat + ', ' + i.lng + '</p>'
            + '<button class="btn" id="modal-guardar">Guardar cambios</button></div>';

        // Coordenadas que se van a guardar (arrancan con las actuales).
        modalCoordInst = { lat: i.lat, lng: i.lng };

        abrirModal('Editar instalación', cuerpo, async function () {
            const datos = {
                id: id,
                nombre:          document.getElementById('e-inombre').value.trim(),
                direccion:       document.getElementById('e-idireccion').value.trim(),
                tipo:            document.getElementById('e-itipo').value,
                capacidadMaxima: document.getElementById('e-icapacidad').value,
                tipoResiduo:     document.getElementById('e-iresiduo').value,
                estado:          document.getElementById('e-iestado').value,
                lat:             modalCoordInst.lat,
                lng:             modalCoordInst.lng,
            };
            try {
                const resp = await fetch(API_GESTION + '/instalaciones/modificar', {
                    method: 'POST', headers: cabeceras(),
                    body: JSON.stringify(datos),
                });
                const r = await resp.json();
                if (resp.ok) { cerrarModal(); recargarSeccionActual(); }
                else modalError(r.error || 'No se pudo modificar.');
            } catch (e) { modalError('Error de conexión.'); }
        });

        // Mini-mapa dentro del modal para reubicar la instalación.
        if (typeof L !== 'undefined') {
            setTimeout(function () {
                const centro = (i.lat && i.lng) ? [i.lat, i.lng] : MVD;
                modalMapaInst = L.map('modal-mapa-inst').setView(centro, 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap', maxZoom: 19,
                }).addTo(modalMapaInst);
                if (i.lat && i.lng) {
                    modalMarcadorInst = L.marker([i.lat, i.lng]).addTo(modalMapaInst);
                }
                modalMapaInst.on('click', function (e) {
                    modalCoordInst.lat = e.latlng.lat;
                    modalCoordInst.lng = e.latlng.lng;
                    if (modalMarcadorInst) modalMarcadorInst.setLatLng(e.latlng);
                    else modalMarcadorInst = L.marker(e.latlng).addTo(modalMapaInst);
                    document.getElementById('e-icoord').textContent =
                        'Nueva ubicación: ' + e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5);
                });
                setTimeout(function () { modalMapaInst.invalidateSize(); }, 200);
            }, 100);
        }
    }

    // -------- EDITAR ÍTEM DE INVENTARIO --------
    function editarMaquinaria(id) {
        fetchGet(API_GESTION + '/maquinaria').then(function (resp) { return resp.json(); }).then(function (lista) {
            const m = lista.find(function (x) { return x.id === id; });
            if (!m) return;
            const sel = function (valor, opcion) { return valor === opcion ? ' selected' : ''; };
            const opcionesInst = cacheInstalaciones.map(function (i) {
                return '<option value="' + i.id + '"' + (i.id === m.instalacionId ? ' selected' : '') + '>' +
                    i.nombre + '</option>';
            }).join('');
            const cuerpo =
                '<div class="form-modal">'
                + '<label>Nombre</label><input type="text" id="e-mnombre" value="' + m.nombre + '">'

                + '<option value="rota"' + sel(m.estado, 'rota') + '>Rota</option></select>'
                + '<label>Cantidad</label><input type="number" id="e-mcantidad" min="1" value="' + m.cantidad + '">'
                + '<label>Instalación</label><select id="e-minstalacion">' + opcionesInst + '</select>'

                        method: 'POST', headers: cabeceras(),
                        body: JSON.stringify(datos),
                    });
                    const r = await resp.json();
                    if (resp.ok) { cerrarModal(); recargarSeccionActual(); }
                    else modalError(r.error || 'No se pudo modificar.');
                } catch (e) { modalError('Error de conexión.'); }
            });
        });
    }

    // Al abrir la página, intentamos restaurar una sesión guardada
    // (para que un refresco no devuelva al login).
    restaurarSesion();
