<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.U — Panel</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- ============================================================
     PANTALLA 1: LOGIN (se muestra al entrar, sin sesión)
     ============================================================ -->
<div class="login-screen" id="pantalla-login">
    <div class="login-card">
        <h1>G.R.U</h1>
        <p class="login-sub">Gestión de Residuos Urbanos</p>
        <p class="login-desc">Ingresá con tu cuenta para acceder al sistema.</p>
        <form id="form-login">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required>
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" required>
            <button type="submit" class="btn">Ingresar</button>
        </form>
        <p class="msg" id="login-msg"></p>
        <a class="link" href="registro.html">¿No tenés cuenta? Registrate como vecino</a>
    </div>
</div>

<!-- ============================================================
     PANTALLA 2: APP (sidebar + header + contenido)
     Oculta hasta iniciar sesión. El color lo pone la clase de rol
     en <body> (tema-vecino, tema-admin, etc.) vía JavaScript.
     ============================================================ -->
<div class="app oculto" id="pantalla-app">

    <!-- SIDEBAR (color según rol) -->
    <aside class="sidebar">
        <div class="logo">
            <h1>G.R.U</h1>
            <p>Gestión de Residuos Urbanos</p>
        </div>
        <nav class="nav" id="nav-menu">
            <!-- El menú se arma por JS según el rol -->
        </nav>
    </aside>

    <!-- ZONA DERECHA: header + contenido -->
    <div class="main">
        <header class="header">
            <span class="header-title" id="header-title">Panel</span>
            <div class="header-right">
                <span class="header-name" id="header-name"></span>
                <span class="badge" id="header-badge"></span>
                <button class="btn-salir" onclick="cerrarSesion()">
                    <span class="material-icons-outlined">logout</span> Cerrar Sesión
                </button>
            </div>
        </header>

        <main class="content" id="content">
            <!-- El contenido se arma por JS según el rol -->
        </main>
    </div>
</div>

<!-- ===== MODAL DE EDICIÓN (reutilizable) ===== -->
<div id="modal-editar" class="modal-fondo oculto">
    <div class="modal-caja">
        <div class="modal-head">
            <h3 id="modal-titulo">Editar</h3>
            <button class="modal-cerrar" onclick="cerrarModal()">&times;</button>
        </div>
        <div id="modal-cuerpo"></div>
        <p class="msg" id="modal-msg"></p>
    </div>
</div>

    const formLogin = document.getElementById('form-login');
    const loginMsg  = document.getElementById('login-msg');

    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginMsg.textContent = '';
        loginMsg.className = 'msg';
        const datos = {
            email:    document.getElementById('login-email').value.trim(),
            password: document.getElementById('login-password').value,
        };
        try {
            const resp = await fetch(API_USUARIOS + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                entrarAlPanel(resultado.usuario);
            } else {
                loginMsg.textContent = (resultado.error || 'No se pudo iniciar sesión.') +
                    (resultado.detalle ? ' [Detalle técnico: ' + resultado.detalle + ']' : '');
                loginMsg.classList.add('err');
            }
        } catch (err) {
            loginMsg.textContent = 'No se pudo conectar con la API de Usuarios.';
            loginMsg.classList.add('err');
        }
    });

    function entrarAlPanel(usuario) {
        // Guardamos la sesión para que sobreviva a un refresco de página.
        // sessionStorage se borra al cerrar el navegador (más seguro).
        try { sessionStorage.setItem('sigeru_usuario', JSON.stringify(usuario)); } catch (e) {}
        mostrarPanelDe(usuario);
    }

    // Aplica en pantalla el panel del usuario (sin volver a tocar el storage).
    function mostrarPanelDe(usuario) {
        usuarioActual = usuario;
        const rol = rolEfectivo(usuario);
        const cfg = ROLES[rol] || ROLES.vecino;

        // Aplicar el color del tema en el body.
        document.body.className = cfg.tema;

        // Header
        document.getElementById('header-title').textContent = cfg.titulo;
        document.getElementById('header-name').textContent = usuario.nombre;
        document.getElementById('header-badge').textContent = cfg.badge;

        // Mostrar la app, ocultar login
        document.getElementById('pantalla-login').classList.add('oculto');
        document.getElementById('pantalla-app').classList.remove('oculto');

        // Armar menú y contenido según el rol
        construirMenu(rol);
        mostrarSeccion('inicio');
    }

    function cerrarSesion() {
        usuarioActual = null;
        try { sessionStorage.removeItem('sigeru_usuario'); } catch (e) {}
        document.body.className = '';
        document.getElementById('pantalla-app').classList.add('oculto');
        document.getElementById('pantalla-login').classList.remove('oculto');
        formLogin.reset();
        loginMsg.textContent = '';
    }

    // Al cargar la página, si había una sesión guardada, la restauramos
    // (así un F5 no te devuelve al login).
    function restaurarSesion() {
        try {
            const guardado = sessionStorage.getItem('sigeru_usuario');
            if (guardado) {
                mostrarPanelDe(JSON.parse(guardado));
            }
        } catch (e) { /* si algo falla, se queda en el login normal */ }
    }

    async function altaUsuario(e) {
        e.preventDefault();
        const msg = document.getElementById('u-msg');
        msg.className = 'msg';
        const rol = document.getElementById('u-rol').value;
        const datos = {
            nombre:   document.getElementById('u-nombre').value.trim(),
            email:    document.getElementById('u-email').value.trim(),
            password: document.getElementById('u-password').value,
            rol:      rol,
        };
        if (rol === 'operario') {
            datos.especialidad = document.getElementById('u-especialidad').value;
        }
        try {
            const resp = await fetch(API_USUARIOS + '/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                msg.textContent = 'Usuario agregado.'; msg.classList.add('ok');
                e.target.reset();
                toggleEspecialidad();
                recargarSeccionActual();
            } else {
                msg.textContent = resultado.error; msg.classList.add('err');
            }
        } catch (err) {
            msg.textContent = 'Error de conexión.'; msg.classList.add('err');
        }
    }

    // =============================================================
    async function cargarCuadrillas() {
        const tbody = document.getElementById('tabla-cuadrillas');
        if (!tbody) return;

        // Traemos usuarios (para nombres) y operarios de recolección libres.
        try { cacheUsuarios = await (await fetchGet(API_USUARIOS + '/usuarios')).json(); } catch (e) { cacheUsuarios = []; }
        let libres = [];
        try { libres = await (await fetchGet(API_USUARIOS + '/operarios-libres')).json(); } catch (e) { libres = []; }

        try {
            const resp = await fetchGet(API_USUARIOS + '/cuadrillas');
            cacheCuadrillas = await resp.json();

            // Filtro: si venimos de un click en camión, mostramos solo esa cuadrilla.
            let lista = cacheCuadrillas;
            const aviso = document.getElementById('cuad-filtro-aviso');
            if (cuadrillaFiltrada !== null) {
                lista = cacheCuadrillas.filter(function (c) { return c.id === cuadrillaFiltrada; });
                if (aviso) aviso.style.display = 'flex';
            } else if (aviso) {
                aviso.style.display = 'none';
            }

            tbody.innerHTML = lista.map(function (c) {
                const integrantes = c.operarios || [];

                // Lista de integrantes actuales, cada uno con botón "Quitar".
                let listaInt;
                if (integrantes.length === 0) {
                    listaInt = '<span class="txt-muted">Sin integrantes</span>';
                } else {
                    listaInt = '<div class="int-lista">' + integrantes.map(function (opId) {
                        const u = cacheUsuarios.find(function (x) { return x.id === opId; });
                        const nombre = u ? u.nombre : ('#' + opId);
                        return '<span class="int-chip">' + nombre +
                            '<button class="chip-x" title="Quitar" onclick="quitarOperario(' + c.id + ',' + opId + ')">&times;</button></span>';
                    }).join('') + '</div>';
                }

                // Selector para agregar un operario libre + botón.
                let agregar;
                if (libres.length === 0) {
                    agregar = '<span class="txt-muted int-nota">No hay operarios de recolección libres.</span>';
                } else {
                    const opts = libres.map(function (op) {
                        return '<option value="' + op.id + '">' + op.nombre + '</option>';
                    }).join('');
                    agregar = '<div class="int-agregar"><select id="add-op-' + c.id + '">' + opts + '</select>' +
                        '<button class="btn-mini" onclick="agregarOperario(' + c.id + ')">Agregar</button></div>';
                }

                return '<tr><td>' + c.id + '</td><td>' + c.nombre + '</td><td>' +
                    (c.zona || '—') + '</td><td>' + listaInt + agregar + '</td><td>' +
                    '<button class="btn-eliminar" onclick="eliminarCuadrilla(' + c.id + ')">Eliminar</button>' +
                    '</td></tr>';
            }).join('');
            if (lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="txt-muted">No hay cuadrillas para mostrar.</td></tr>';
            }
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="5">Error al conectar con API Usuarios.</td></tr>';
        }
        const form = document.getElementById('form-cuadrilla');
        if (form) form.onsubmit = altaCuadrilla;
    }

    async function cargarCamiones() {
        const tbody = document.getElementById('tabla-camiones');
        // Aseguramos tener flotas y cuadrillas en cache para mostrar nombres.
        if (cacheFlotas.length === 0) { try { cacheFlotas = await (await fetchGet(API_RECOLECCION + '/flotas')).json(); } catch (e) {} }
        if (cacheCuadrillas.length === 0) { try { cacheCuadrillas = await (await fetchGet(API_USUARIOS + '/cuadrillas')).json(); } catch (e) {} }
        try {
            const resp = await fetchGet(API_RECOLECCION + '/camiones');
            const lista = await resp.json();
            // Cuadrillas ya usadas por algún camión (para no repetir).
            const usadas = lista.filter(function (x) { return x.cuadrillaId !== null && x.cuadrillaId !== undefined; })
                                 .map(function (x) { return x.cuadrillaId; });
            tbody.innerHTML = lista.map(function (k) {
                // Selector de cuadrilla: ofrece las libres + la propia del camión.
                let opcCuad = '<option value="">(sin cuadrilla)</option>' +
                    cacheCuadrillas.filter(function (c) {
                        return usadas.indexOf(c.id) === -1 || c.id === k.cuadrillaId;
                    }).map(function (c) {
                        const sel = (c.id === k.cuadrillaId) ? ' selected' : '';
                        return '<option value="' + c.id + '"' + sel + '>' + c.nombre + '</option>';
                    }).join('');
                const selectCuad = '<select onchange="asignarCuadrilla(' + k.id + ', this.value)">' + opcCuad + '</select>';
                // Selector de flota en línea para mover el camión.
                let opcFlota = '<option value="">(sin flota)</option>' +
                    cacheFlotas.map(function (f) {
                        const sel = (f.id === k.flotaId) ? ' selected' : '';
                        return '<option value="' + f.id + '"' + sel + '>' + f.nombre + '</option>';
                    }).join('');
                const selectFlota = '<select onchange="moverAFlota(' + k.id + ', this.value)">' + opcFlota + '</select>';
                return '<tr><td>' + k.id + '</td><td>' + k.patente + '</td><td>' +
                    k.modelo + '</td><td>' + k.estado + '</td><td>' + k.disponibilidad + '</td><td>' +
                    selectFlota + '</td><td>' + selectCuad + '</td><td>' +
                    '<button class="btn-editar" onclick="editarCamion(' + k.id + ')">Editar</button> ' +
                    '<button class="btn-eliminar" onclick="eliminarCamion(' + k.id + ')">Eliminar</button>' +
                    '</td></tr>';
            }).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="8">Error al conectar con API Recolección.</td></tr>';
        }
        const form = document.getElementById('form-camion');
        if (form) form.onsubmit = altaCamion;
    }

    // Dibuja el panel: una TABLA por flota que engloba sus camiones.
    // Al clickear un camión, se navega a la cuadrilla asignada (sección Usuarios).
    async function cargarPanelFlotas() {
        const cont = document.getElementById('panel-flotas');
        const form = document.getElementById('form-flota');
        if (form) form.onsubmit = altaFlota;

        try {
            cacheFlotas     = await (await fetchGet(API_RECOLECCION + '/flotas')).json();
            cacheCuadrillas = await (await fetchGet(API_USUARIOS + '/cuadrillas')).json();
            const camiones  = await (await fetchGet(API_RECOLECCION + '/camiones')).json();

            let html = cacheFlotas.map(function (f) {
                const suyos = camiones.filter(function (k) { return k.flotaId === f.id; });
                // Camiones que NO están en ninguna flota (para el selector de agregar)
                const libres = camiones.filter(function (k) { return k.flotaId === null || k.flotaId === undefined; });

                let filas;
                if (suyos.length === 0) {
                    filas = '<tr><td colspan="4" class="flota-vacia">Sin camiones en esta flota</td></tr>';
                } else {
                    filas = suyos.map(function (k) {
                        const cuadTxt = (k.cuadrillaId === null || k.cuadrillaId === undefined)
                            ? '<span class="txt-muted">Sin cuadrilla</span>'
                            : '<a class="link-cuad" onclick="irACuadrilla(' + k.cuadrillaId + ')">' +
                              nombreCuadrilla(k.cuadrillaId) + '</a>';
                        return '<tr class="fila-camion" onclick="clickCamionFlota(event, ' + k.id + ', ' +
                            (k.cuadrillaId === null ? 'null' : k.cuadrillaId) + ", '" + k.patente.replace(/'/g, '') + "')" + '">' +
                            '<td>' + k.patente + '</td><td>' + k.modelo + '</td><td>' + k.estado + '</td><td>' +
                            cuadTxt + '</td></tr>';
                    }).join('');
                }

                // Selector para agregar un camión libre a esta flota.
                const opcionesLibres = libres.length
                    ? libres.map(function (k) { return '<option value="' + k.id + '">' + k.patente + ' - ' + k.modelo + '</option>'; }).join('')
                    : '';
                const agregar = libres.length
                    ? '<div class="flota-agregar"><select id="add-flota-' + f.id + '">' +
                      '<option value="">Agregar camión sin flota…</option>' + opcionesLibres + '</select>' +
                      '<button class="btn-mini" onclick="agregarCamionAFlota(' + f.id + ')">Agregar</button></div>'
                    : '<p class="txt-muted flota-nota">No hay camiones sin flota para agregar.</p>';

                return '<div class="flota-bloque">' +
                    '<div class="flota-head"><h3>' + f.nombre + '</h3>' +
                    '<span class="flota-zona">' + (f.zona || '') + '</span>' +
                    '<button class="btn-eliminar" onclick="eliminarFlota(' + f.id + ')">Eliminar</button></div>' +
                    '<table class="tabla"><thead><tr><th>Patente</th><th>Modelo</th><th>Estado</th>' +
                    '<th>Cuadrilla</th></tr></thead><tbody>' + filas + '</tbody></table>' +
                    agregar + '</div>';
            }).join('');

            cont.innerHTML = html || '<p class="flota-vacia">No hay flotas. Creá una arriba.</p>';
        } catch (err) {
            cont.innerHTML = '<p class="flota-vacia">Error al conectar con las APIs.</p>';
        }
    }

                      return '<option value="' + c.id + '">' + c.codigo + ' — ' + c.direccion + '</option>';
                  }).join('') + '</select>' +
                  '<button class="btn-mini" onclick="agregarARuta(' + r.id + ')">Agregar parada</button></div>'
                : '<p class="txt-muted flota-nota">Todos los contenedores ya están en esta ruta.</p>';

            return '<div class="flota-bloque">' +
                '<div class="flota-head"><h3>' + r.nombre + '</h3>' +
                '<span class="flota-zona">' + r.diaLegible + ' · ' + r.turno +
                (r.zona ? ' · ' + r.zona : '') + '</span>' +
                '<select onchange="asignarCuadrillaRuta(' + r.id + ', this.value)">' + opcCuad + '</select> ' +
                '<button class="btn-editar" onclick="editarRuta(' + r.id + ')">Editar</button> ' +
                '<button class="btn-eliminar" onclick="eliminarRuta(' + r.id + ')">Eliminar</button></div>' +
                '<table class="tabla"><thead><tr><th>#</th><th>Contenedor</th>' +
                '<th>Dirección</th><th>Acción</th></tr></thead><tbody>' + paradas + '</tbody></table>' +
                agregar + '</div>';
        }).join('');
    }

    async function altaRuta(e) {
        e.preventDefault();
        const msg = document.getElementById('rt-msg');
        msg.className = 'msg';
        const datos = {
            nombre:      document.getElementById('rt-nombre').value.trim(),
            zona:        document.getElementById('rt-zona').value.trim(),
            diaSemana:   document.getElementById('rt-dia').value,
            turno:       document.getElementById('rt-turno').value,
            cuadrillaId: document.getElementById('rt-cuadrilla').value,
        };
        try {
            const resp = await fetch(API_RECOLECCION + '/rutas', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const res = await leerRespuesta(resp);
            if (res.ok) {
                msg.textContent = 'Ruta creada.'; msg.classList.add('ok');
                e.target.reset(); recargarSeccionActual();
            } else {
                msg.textContent = textoError(res.datos, 'No se pudo crear.');
                msg.classList.add('err');
            }
        } catch (err) { msg.textContent = 'Error de conexión.'; msg.classList.add('err'); }
    }

    async function eliminarRuta(id) {
        if (!confirm('¿Eliminar esta ruta y su recorrido?')) return;
        await accionRuta('/rutas/eliminar', { id: id });
    }

    async function agregarARuta(rutaId) {
        const sel = document.getElementById('add-ruta-' + rutaId);
        if (!sel || !sel.value) { alert('Elegí un contenedor.'); return; }
        await accionRuta('/rutas/agregar-contenedor',
                         { rutaId: rutaId, contenedorId: parseInt(sel.value) });
    }

    async function quitarDeRuta(rutaId, contenedorId) {
        await accionRuta('/rutas/quitar-contenedor',
                         { rutaId: rutaId, contenedorId: contenedorId });
    }

    async function asignarCuadrillaRuta(id, cuadrillaId) {
        const r = cacheRutas.find(function (x) { return x.id === id; });
        if (!r) return;
        await accionRuta('/rutas/modificar', {
            id: id, nombre: r.nombre, zona: r.zona,
            diaSemana: r.diaSemana, turno: r.turno,
            cuadrillaId: cuadrillaId || null,
        });
    }

    // Helper común: manda la acción y recarga la sección si salió bien.
    async function accionRuta(ruta, datos) {
        try {
            const resp = await fetch(API_RECOLECCION + ruta, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const res = await leerRespuesta(resp);
            if (res.ok) recargarSeccionActual();
            else alert(textoError(res.datos, 'No se pudo completar la acción.'));
        } catch (e) { alert('Error de conexión.'); }
    }

    function editarRuta(id) {
        const r = cacheRutas.find(function (x) { return x.id === id; });
        if (!r) return;
        const sel = function (v, o) { return v === o ? ' selected' : ''; };
        const dias = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
        const nombresDias = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
        const cuerpo =
            '<div class="form-modal">'
            + '<label>Nombre</label><input type="text" id="e-rtnombre" value="' + r.nombre + '">'
            + '<label>Zona</label><input type="text" id="e-rtzona" value="' + (r.zona || '') + '">'
            + '<label>Día</label><select id="e-rtdia">'
            + dias.map(function (d, i) {
                return '<option value="' + d + '"' + sel(r.diaSemana, d) + '>' + nombresDias[i] + '</option>';
              }).join('') + '</select>'
            + '<label>Turno</label><select id="e-rtturno">'
            + '<option value="matutino"' + sel(r.turno, 'matutino') + '>Matutino</option>'
            + '<option value="vespertino"' + sel(r.turno, 'vespertino') + '>Vespertino</option>'
            + '<option value="nocturno"' + sel(r.turno, 'nocturno') + '>Nocturno</option></select>'
            + '<button class="btn" id="modal-guardar">Guardar cambios</button></div>';

        abrirModal('Editar ruta', cuerpo, async function () {
            const datos = {
                id: id,
                nombre:    document.getElementById('e-rtnombre').value.trim(),
                zona:      document.getElementById('e-rtzona').value.trim(),
                diaSemana: document.getElementById('e-rtdia').value,
                turno:     document.getElementById('e-rtturno').value,
                cuadrillaId: r.cuadrillaId,
            };
            try {
                const resp = await fetch(API_RECOLECCION + '/rutas/modificar', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos),
                });
                const res = await leerRespuesta(resp);
                if (res.ok) { cerrarModal(); recargarSeccionActual(); }
                else modalError(textoError(res.datos, 'No se pudo modificar.'));
            } catch (e) { modalError('Error de conexión.'); }
        });
    }

    // Panel del operario de RECOLECCIÓN: su cuadrilla, su camión y sus rutas.
    async function panelRecoleccion() {
        const cont = document.getElementById('content');
        cont.innerHTML = '<div class="op-panel"><h2 class="op-titulo">Mi jornada</h2>' +
            '<p class="txt-muted">Cargando tu información…</p></div>';

        // El operario guarda el id de su cuadrilla en el campo "cuadrilla".
        const cuadrillaId = usuarioActual.cuadrilla ? parseInt(usuarioActual.cuadrilla) : null;
        let html = '<div class="op-panel"><h2 class="op-titulo">Mi jornada</h2>';

        if (cuadrillaId === null || isNaN(cuadrillaId)) {
            html += '<div class="op-aviso">Todavía no estás asignado a ninguna cuadrilla. ' +
                    'Consultá con la administración.</div></div>';
            cont.innerHTML = html;
            return;
        }

        // --- Cuadrilla y compañeros ---
        let cuadrilla = null, companeros = [];
        try {
            const cuads = await (await fetchGet(API_USUARIOS + '/cuadrillas')).json();
            cuadrilla = cuads.find(function (c) { return c.id === cuadrillaId; });
            const usuarios = await (await fetchGet(API_USUARIOS + '/usuarios')).json();
            if (cuadrilla) {
                companeros = (cuadrilla.operarios || [])
                    .filter(function (id) { return id !== usuarioActual.id; })
                    .map(function (id) {
                        const u = usuarios.find(function (x) { return x.id === id; });
                        return u ? u.nombre : ('#' + id);
                    });
            }
        } catch (e) {}

        html += '<div class="op-cards">';
        html += '<div class="op-card"><span class="material-icons-outlined">groups</span>' +
                '<h3>Mi cuadrilla</h3><p class="op-dato">' +
                (cuadrilla ? cuadrilla.nombre : 'Sin datos') + '</p>' +
                '<p class="txt-muted">' + (cuadrilla && cuadrilla.zona ? cuadrilla.zona : '') + '</p>' +
                (companeros.length
                    ? '<p class="txt-muted">Compañeros: ' + companeros.join(', ') + '</p>'
                    : '<p class="txt-muted">Sos el único integrante</p>') +
                '</div>';

        // --- Camión asignado a la cuadrilla (3.1.2.1.2) ---
        let camion = null;
        try {
            const camiones = await (await fetchGet(API_RECOLECCION + '/camiones')).json();
            camion = camiones.find(function (k) { return k.cuadrillaId === cuadrillaId; });
        } catch (e) {}

        html += '<div class="op-card"><span class="material-icons-outlined">local_shipping</span>' +
                '<h3>Mi camión</h3>';
        if (camion) {
            html += '<p class="op-dato">' + camion.patente + '</p>' +
                    '<p class="txt-muted">' + camion.modelo + '</p>' +
                    '<p>' + etiquetaEstadoCamion(camion.estado) + ' ' +
                    etiquetaDisponibilidad(camion.disponibilidad) + '</p>';
        } else {
            html += '<p class="txt-muted">No hay ningún camión asignado a tu cuadrilla.</p>';
        }
        html += '</div></div>';

        // --- Rutas asignadas (3.1.2.1.1) ---
        html += '<h2 class="sec-titulo">Mis rutas de recolección</h2><div id="op-rutas">' +
                '<p class="txt-muted">Cargando rutas…</p></div>';
        html += '</div>';
        cont.innerHTML = html;

        // Dibujar las rutas con su recorrido de contenedores.
        try {
            const rutas = await (await fetchGet(API_RECOLECCION + '/rutas/cuadrilla?id=' + cuadrillaId)).json();
            const contenedores = await (await fetchGet(API_GESTION + '/contenedores')).json();
            const divRutas = document.getElementById('op-rutas');
            if (rutas.length === 0) {
                divRutas.innerHTML = '<p class="flota-vacia">Todavía no tenés rutas asignadas.</p>';
            } else {
                divRutas.innerHTML = rutas.map(function (r) {
                    const paradas = (r.contenedores || []).map(function (cid, i) {
                        const c = contenedores.find(function (x) { return x.id === cid; });
                        if (!c) return '';
                        return '<li><b>' + (i + 1) + '.</b> ' + c.codigo + ' — ' + c.direccion +
                               ' ' + etiquetaLlenado(c.nivelLlenado) + '</li>';
                    }).join('');
                    return '<div class="op-ruta">' +
                        '<div class="op-ruta-cab"><h3>' + r.nombre + '</h3>' +
                        '<span class="pill pill-ok">' + r.diaLegible + '</span> ' +
                        '<span class="pill pill-warn">' + r.turno + '</span>' +
                        (r.zona ? '<span class="txt-muted">' + r.zona + '</span>' : '') + '</div>' +
                        (paradas
                            ? '<ol class="op-paradas">' + paradas + '</ol>'
                            : '<p class="txt-muted">Esta ruta todavía no tiene contenedores cargados.</p>') +
                        '</div>';
                }).join('');
            }
        } catch (e) {
            document.getElementById('op-rutas').innerHTML =
                '<p class="flota-vacia">No se pudieron cargar las rutas.</p>';
        }
    }

        return '<span class="pill pill-' + clase + '">' + texto + '</span>';

        const clase = (disp === 'en_ruta') ? 'warn' : 'ok';
        const texto = (disp === 'en_ruta') ? 'En ruta' : 'Disponible';
        return '<span class="pill pill-' + clase + '">' + texto + '</span>';

                '<p class="txt-muted">' + pct + '% de la capacidad' +

                '</p></div>';

        // --- Inventario de maquinaria (3.1.2.2.2 y 3.1.2.3.2) ---

        if (items.length === 0) {
            html += '<p class="flota-vacia">No hay equipamiento registrado en tu instalación.</p>';
        } else {
            html += '<table class="tabla"><thead><tr><th>Ítem</th><th>Categoría</th>' +
                    '<th>Cantidad</th><th>Estado</th></tr></thead><tbody>' +
                    items.map(function (m) {
                        return '<tr><td>' + m.nombre + '</td><td>' + m.categoria + '</td><td>' +
                               m.cantidad + '</td><td>' + etiquetaEstado(m.estado) + '</td></tr>';
                    }).join('') + '</tbody></table>';
        }

        html += '<div class="op-nota">¿Detectaste un problema en un contenedor? ' +
                'Reportalo desde la sección <b>Incidencias</b>.</div>';
        html += '</div>';
        cont.innerHTML = html;

    function etiquetaEstadoInstalacion(estado) {
        const clases = { operativa: 'ok', mantenimiento: 'warn', fuera_servicio: 'bad' };
        const textos = { operativa: 'Operativa', mantenimiento: 'En mantenimiento',
                         fuera_servicio: 'Fuera de servicio' };
        return '<span class="pill pill-' + (clases[estado] || 'ok') + '">' +
               (textos[estado] || estado) + '</span>';
    }

    // =============================================================
    //  INCIDENCIAS (mapa para todos + gestión para el admin)
    // =============================================================
    let mapaInc = null, capaPinesInc = null;
    let contenedorElegido = null;      // el contenedor clickeado en el mapa
    let cacheContenedores = [];
    let cacheIncidencias = [];

    async function cargarIncidencias() {
        const esAdmin = rolEfectivo(usuarioActual) === 'administrador';

        if (typeof L === 'undefined') {
            const div = document.getElementById('mapa-incidencias');
            if (div) div.outerHTML = '<div class="mapa-error">No se pudo cargar el mapa. ' +
                'Verificá tu conexión a internet.</div>';
        } else {
            setTimeout(function () {
                if (document.getElementById('mapa-incidencias') && !mapaInc) {
                    mapaInc = L.map('mapa-incidencias').setView(MVD, 12);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap', maxZoom: 19,
                    }).addTo(mapaInc);
                    capaPinesInc = L.layerGroup().addTo(mapaInc);
                }
                refrescarMapaIncidencias();
                setTimeout(function () { if (mapaInc) mapaInc.invalidateSize(); }, 250);
            }, 100);
        }

        // El admin necesita las cuadrillas para poder asignar responsables.
        if (esAdmin && cacheCuadrillas.length === 0) {
            try { cacheCuadrillas = await (await fetchGet(API_USUARIOS + '/cuadrillas')).json(); } catch (e) {}
        }
        refrescarListaIncidencias();
        if (esAdmin) refrescarHistorial();
    }

    // Dibuja los contenedores en el mapa, marcando los que tienen incidencias.
    async function refrescarMapaIncidencias() {
        try {
            cacheContenedores = await (await fetchGet(API_GESTION + '/contenedores')).json();
            cacheIncidencias  = await (await fetchGet(API_GESTION + '/incidencias')).json();
        } catch (err) { return; }

        if (!capaPinesInc) return;
        capaPinesInc.clearLayers();

        cacheContenedores.forEach(function (c) {
            if (c.lat === null || c.lng === null) return;
            // ¿Este contenedor tiene incidencias activas?
            const suyas = cacheIncidencias.filter(function (i) { return i.contenedorId === c.id; });
            const conProblema = suyas.length > 0;

            const marcador = L.marker([c.lat, c.lng], {
                icon: iconoPinIncidencia(colorEstado(c.estado), conProblema)
            });

            let popup = '<b>' + c.codigo + '</b><br>' + c.direccion +
                        '<br>Tipo: ' + c.tipoResiduo +
                        '<br>Estado: ' + (c.estado === 'roto' ? 'Roto' : 'Operativo') +
                        '<br>Llenado: ' + textoLlenado(c.nivelLlenado);
            if (conProblema) {
                popup += '<br><b style="color:#c62828">' + suyas.length +
                         ' problema(s) reportado(s)</b>';
            }
            popup += '<br><i>Click en el pin para seleccionarlo</i>';

            marcador.bindPopup(popup);
            marcador.on('click', function () { elegirContenedor(c.id); });
            marcador.addTo(capaPinesInc);
        });
    }

    // Pin con anillo rojo si el contenedor tiene incidencias abiertas.
    function iconoPinIncidencia(color, conProblema) {
        const borde = conProblema ? '3px solid #c62828' : '2px solid #fff';
        const tam = conProblema ? 22 : 18;
        return L.divIcon({
            className: 'pin-cont',
            html: '<span style="background:' + color + '; border:' + borde +
                  '; width:' + tam + 'px; height:' + tam + 'px"></span>',
            iconSize: [tam, tam],
            iconAnchor: [tam / 2, tam / 2],
        });
    }

    // Al clickear un contenedor en el mapa queda seleccionado para reportar.
    function elegirContenedor(id) {
        contenedorElegido = id;
        const c = cacheContenedores.find(function (x) { return x.id === id; });
        const span = document.getElementById('cont-elegido');
        const btn  = document.getElementById('btn-reportar');
        if (span && c) {
            span.textContent = 'Seleccionado: ' + c.codigo + ' — ' + c.direccion;
            span.className = 'cont-ok';
        }
        if (btn) btn.disabled = false;
    }

    // Modal para describir el problema.
    function abrirReporte() {
        if (contenedorElegido === null) { alert('Elegí un contenedor en el mapa.'); return; }
        const c = cacheContenedores.find(function (x) { return x.id === contenedorElegido; });
        const cuerpo =
            '<div class="form-modal">'
            + '<p class="txt-muted">Contenedor: <b>' + (c ? c.codigo + ' — ' + c.direccion : '') + '</b></p>'
            + '<label>Tipo de problema</label><select id="r-tipo">'
            + '<option value="desborde">Desborde</option>'
            + '<option value="rotura">Rotura</option>'
            + '<option value="falta_recoleccion">Falta de recolección</option>'
            + '<option value="otro">Otro</option></select>'
            + '<label>Gravedad</label><select id="r-gravedad">'
            + '<option value="baja">Baja</option>'
            + '<option value="media" selected>Media</option>'
            + '<option value="alta">Alta</option></select>'
            + '<label>Descripción del problema</label>'
            + '<textarea id="r-descripcion" rows="3" placeholder="Contanos brevemente qué pasa..."></textarea>'
            + '<button class="btn" id="modal-guardar">Enviar reporte</button></div>';

        abrirModal('Reportar un problema', cuerpo, async function () {
            const datos = {
                contenedorId:       contenedorElegido,
                tipo:               document.getElementById('r-tipo').value,
                gravedad:           document.getElementById('r-gravedad').value,
                descripcion:        document.getElementById('r-descripcion').value.trim(),
                reportadoPor:       usuarioActual ? usuarioActual.id : null,
                reportadoPorNombre: usuarioActual ? usuarioActual.nombre : 'Anónimo',
            };
            try {
                const resp = await fetch(API_GESTION + '/incidencias', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos),
                });
                const r = await resp.json();
                if (resp.ok) { cerrarModal(); recargarSeccionActual(); }
                else modalError(r.error || 'No se pudo reportar.');
            } catch (e) { modalError('Error de conexión.'); }
        });
    }

    // Lista de incidencias activas. El admin ve controles de gestión.
    async function refrescarListaIncidencias() {
        const cont = document.getElementById('lista-incidencias');
        if (!cont) return;
        const esAdmin = rolEfectivo(usuarioActual) === 'administrador';

        try {
            cacheIncidencias = await (await fetchGet(API_GESTION + '/incidencias')).json();
            if (cacheContenedores.length === 0) {
                cacheContenedores = await (await fetchGet(API_GESTION + '/contenedores')).json();
            }
        } catch (err) {
            cont.innerHTML = '<p class="flota-vacia">Error al conectar con API Gestión.</p>';
            return;
        }

        if (cacheIncidencias.length === 0) {
            cont.innerHTML = '<p class="flota-vacia">No hay incidencias activas. Todo en orden.</p>';
            return;
        }

        const filas = cacheIncidencias.map(function (i) {
            const c = cacheContenedores.find(function (x) { return x.id === i.contenedorId; });
            const cont_txt = c ? (c.codigo + ' — ' + c.direccion) : ('#' + i.contenedorId);

            let acciones = '';
            if (esAdmin) {
                // Selector de estado
                const est = ['abierta', 'en_curso'].map(function (e) {
