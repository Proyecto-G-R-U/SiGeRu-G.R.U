<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.R.U — Panel</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- ============================================================
     PANTALLA 1: LOGIN (se muestra al entrar, sin sesión)
     ============================================================ -->
<div class="login-screen" id="pantalla-login">
    <div class="login-card">
        <h1>G.R.U</h1>
        <p class="login-sub">Gestión de Residuos Urbanos</p>
        <p class="login-desc">Ingresá con tu cuenta para acceder al sistema.</p>
        <form id="form-login">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required>
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" required>
            <button type="submit" class="btn">Ingresar</button>
        </form>
        <p class="msg" id="login-msg"></p>
        <a class="link" href="registro.html">¿No tenés cuenta? Registrate como vecino</a>
    </div>
</div>

<!-- ============================================================
     PANTALLA 2: APP (sidebar + header + contenido)
     Oculta hasta iniciar sesión. El color lo pone la clase de rol
     en <body> (tema-vecino, tema-admin, etc.) vía JavaScript.
     ============================================================ -->
<div class="app oculto" id="pantalla-app">

    <!-- SIDEBAR (color según rol) -->
    <aside class="sidebar">
        <div class="logo">
            <h1>G.R.U</h1>
            <p>Gestión de Residuos Urbanos</p>
        </div>
        <nav class="nav" id="nav-menu">
            <!-- El menú se arma por JS según el rol -->
        </nav>
    </aside>

    <!-- ZONA DERECHA: header + contenido -->
    <div class="main">
        <header class="header">
            <span class="header-title" id="header-title">Panel</span>
            <div class="header-right">
                <span class="header-name" id="header-name"></span>
                <span class="badge" id="header-badge"></span>
                <button class="btn-salir" onclick="cerrarSesion()">
                    <span class="material-icons-outlined">logout</span> Cerrar Sesión
                </button>
            </div>
        </header>

        <main class="content" id="content">
            <!-- El contenido se arma por JS según el rol -->
        </main>
    </div>
</div>

<!-- ===== MODAL DE EDICIÓN (reutilizable) ===== -->
<div id="modal-editar" class="modal-fondo oculto">
    <div class="modal-caja">
        <div class="modal-head">
            <h3 id="modal-titulo">Editar</h3>
            <button class="modal-cerrar" onclick="cerrarModal()">&times;</button>
        </div>
        <div id="modal-cuerpo"></div>
        <p class="msg" id="modal-msg"></p>
    </div>
</div>

<!-- ============================================================
     JAVASCRIPT EMBEBIDO
     ============================================================ -->
<script>
    const API_USUARIOS    = '../api-usuarios';
    const API_GESTION     = '../api-gestion';
    const API_RECOLECCION = '../api-recoleccion';

    // Helper para peticiones GET que evita el caché del navegador. Sin esto,
    // Chrome a veces devuelve la respuesta vieja y las listas no se actualizan
    // hasta refrescar la página. 'no-store' obliga a pedir datos frescos.
    function fetchGet(url) {
        return fetch(url, { cache: 'no-store' });
    }

    // Usuario logueado (para saber su rol/especialidad y su email).
    let usuarioActual = null;

    // Caches en memoria para mostrar nombres (no ids) de cuadrillas y flotas.
    let cacheCuadrillas = [];
    let cacheFlotas = [];
    let cacheUsuarios = [];

    // Si viene de "click en camión", muestra solo esta cuadrilla en Usuarios.
    let cuadrillaFiltrada = null;

    // Recuerda en qué pestaña/sección estamos, para poder recargarla entera
    // tras agregar o eliminar algo (así se actualizan tabla, selectores y mapa).
    let seccionActual = 'inicio';

    // -------------------------------------------------------------
    // CONFIGURACIÓN DE CADA ROL: color (clase de tema), título del
    // panel, texto del badge y el "tipo" con el que decidimos la vista.
    // El rol efectivo de un operario se arma como 'operario_<especialidad>'.
    // -------------------------------------------------------------
    const ROLES = {
        vecino:                 { tema: 'tema-vecino',        titulo: 'Panel Informativo Vecinal', badge: 'Público' },
        administrador:          { tema: 'tema-admin',         titulo: 'Panel Administrativo',       badge: 'Admin Municipal' },
        operario_recoleccion:   { tema: 'tema-recoleccion',   titulo: 'Panel de Recolección',       badge: 'Op. Recolección' },
        operario_clasificacion: { tema: 'tema-clasificacion', titulo: 'Panel de Clasificación',     badge: 'Op. Clasificación' },
        operario_vertedero:     { tema: 'tema-vertedero',     titulo: 'Panel de Vertedero',         badge: 'Op. Vertedero' },
    };

    // Devuelve el rol efectivo de un usuario (distingue los 3 operarios).
    function rolEfectivo(u) {
        if (u.rol === 'operario') {
            return 'operario_' + (u.especialidad || 'recoleccion');
        }
        return u.rol;
    }

    // -------------------------------------------------------------
    // LOGIN
    // -------------------------------------------------------------
    const formLogin = document.getElementById('form-login');
    const loginMsg  = document.getElementById('login-msg');

    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginMsg.textContent = '';
        loginMsg.className = 'msg';
        const datos = {
            email:    document.getElementById('login-email').value.trim(),
            password: document.getElementById('login-password').value,
        };
        try {
            const resp = await fetch(API_USUARIOS + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                entrarAlPanel(resultado.usuario);
            } else {
                loginMsg.textContent = resultado.error || 'No se pudo iniciar sesión.';
                loginMsg.classList.add('err');
            }
        } catch (err) {
            loginMsg.textContent = 'No se pudo conectar con la API de Usuarios.';
            loginMsg.classList.add('err');
        }
    });

    function entrarAlPanel(usuario) {
        // Guardamos la sesión para que sobreviva a un refresco de página.
        // sessionStorage se borra al cerrar el navegador (más seguro).
        try { sessionStorage.setItem('sigeru_usuario', JSON.stringify(usuario)); } catch (e) {}
        mostrarPanelDe(usuario);
    }

    // Aplica en pantalla el panel del usuario (sin volver a tocar el storage).
    function mostrarPanelDe(usuario) {
        usuarioActual = usuario;
        const rol = rolEfectivo(usuario);
        const cfg = ROLES[rol] || ROLES.vecino;

        // Aplicar el color del tema en el body.
        document.body.className = cfg.tema;

        // Header
        document.getElementById('header-title').textContent = cfg.titulo;
        document.getElementById('header-name').textContent = usuario.nombre;
        document.getElementById('header-badge').textContent = cfg.badge;

        // Mostrar la app, ocultar login
        document.getElementById('pantalla-login').classList.add('oculto');
        document.getElementById('pantalla-app').classList.remove('oculto');

        // Armar menú y contenido según el rol
        construirMenu(rol);
        mostrarSeccion('inicio');
    }

    function cerrarSesion() {
        usuarioActual = null;
        try { sessionStorage.removeItem('sigeru_usuario'); } catch (e) {}
        document.body.className = '';
        document.getElementById('pantalla-app').classList.add('oculto');
        document.getElementById('pantalla-login').classList.remove('oculto');
        formLogin.reset();
        loginMsg.textContent = '';
    }

    // Al cargar la página, si había una sesión guardada, la restauramos
    // (así un F5 no te devuelve al login).
    function restaurarSesion() {
        try {
            const guardado = sessionStorage.getItem('sigeru_usuario');
            if (guardado) {
                mostrarPanelDe(JSON.parse(guardado));
            }
        } catch (e) { /* si algo falla, se queda en el login normal */ }
    }

    // -------------------------------------------------------------
    // MENÚ LATERAL según el rol
    // Solo el administrador tiene secciones de gestión. El resto solo "Inicio".
    // -------------------------------------------------------------
    function construirMenu(rol) {
        const nav = document.getElementById('nav-menu');
        let items = [{ id: 'inicio', icono: 'home', texto: 'Inicio' }];

        if (rol === 'administrador') {
            items.push(
                { id: 'usuarios',     icono: 'group',          texto: 'Usuarios' },
                { id: 'contenedores', icono: 'delete',         texto: 'Contenedores' },
                { id: 'camiones',     icono: 'local_shipping', texto: 'Camiones' },
                { id: 'flotas',       icono: 'grid_view',      texto: 'Flotas' },
            );
        }

        nav.innerHTML = items.map(function (it, i) {
            return '<a class="nav-item' + (i === 0 ? ' activo' : '') + '" ' +
                'id="nav-' + it.id + '" onclick="clickMenu(\'' + it.id + '\')">' +
                '<span class="material-icons-outlined">' + it.icono + '</span> ' + it.texto + '</a>';
        }).join('');
    }

    // Click en el menú lateral. Limpia el filtro de cuadrilla (para que
    // "Usuarios" desde el menú muestre siempre todas), y muestra la sección.
    function clickMenu(id) {
        cuadrillaFiltrada = null;
        mostrarSeccion(id);
    }

    // -------------------------------------------------------------
    // CAMBIO DE SECCIÓN
    // -------------------------------------------------------------
    function mostrarSeccion(id) {
        seccionActual = id; // recordamos dónde estamos
        // marcar activo en el menú
        document.querySelectorAll('.nav-item').forEach(function (a) { a.classList.remove('activo'); });
        const navEl = document.getElementById('nav-' + id);
        if (navEl) navEl.classList.add('activo');

        const content = document.getElementById('content');

        if (id === 'inicio') {
            const rol = rolEfectivo(usuarioActual);
            if (rol === 'vecino') {
                content.innerHTML = landingVecino();
            } else if (rol === 'administrador') {
                content.innerHTML = '<div class="bienvenida"><h2>Hola, ' + usuarioActual.nombre +
                    '</h2><p>Bienvenido al panel administrativo. Usá el menú lateral para gestionar ' +
                    'usuarios, contenedores, camiones y flotas.</p></div>';
            } else {
                content.innerHTML = '<div class="bienvenida"><h2>Hola, ' + usuarioActual.nombre +
                    '</h2><p>Bienvenido a tu panel. Por el momento este panel es informativo.</p></div>';
            }
            return;
        }

        // Secciones de administrador
        if (id === 'usuarios')     { content.innerHTML = plantillaUsuarios();     cargarUsuarios(); cargarCuadrillas(); }
        if (id === 'contenedores') { content.innerHTML = plantillaContenedores(); cargarContenedores(); }
        if (id === 'camiones')     { content.innerHTML = plantillaCamiones();     cargarCamiones(); cargarFlotasEnSelect(); cargarCuadrillasEnSelect(); }
        if (id === 'flotas')       { content.innerHTML = plantillaFlotas();       cargarPanelFlotas(); }
    }

    // Vuelve a dibujar la sección actual completa (tabla + selectores + mapa),
    // sin recargar la página ni sacarte de la pestaña. Se llama después de
    // agregar o eliminar algo, para que TODO lo que depende de esos datos
    // (no solo la tabla) se actualice al instante.
    function recargarSeccionActual() {
        if (seccionActual && seccionActual !== 'inicio') {
            mostrarSeccion(seccionActual);
        }
    }

    // =============================================================
    //  PLANTILLAS DE SECCIÓN (solo admin)
    // =============================================================

    // Contenido informativo de G.R.U que ve el vecino en su Inicio.
    function landingVecino() {
        return ''
        + '<div class="landing-vecino">'
        + '  <div class="lv-hero">'
        + '    <h2>Bienvenido a G.R.U</h2>'
        + '    <p class="lv-sub">Gestión de Residuos Urbanos</p>'
        + '    <p class="lv-intro">G.R.U es el sistema municipal que coordina la recolección, '
        + '    clasificación y disposición de los residuos de la ciudad. Como vecino, sos una '
        + '    parte fundamental para mantener limpio y sano nuestro entorno.</p>'
        + '  </div>'
        + '  <div class="lv-cards">'
        + '    <div class="lv-card"><span class="material-icons-outlined">recycling</span>'
        + '      <h3>Reciclá bien</h3>'
        + '      <p>Separá tus residuos en reciclables y mezclados. Cada contenedor tiene su tipo, '
        + '      identificado por color y etiqueta.</p></div>'
        + '    <div class="lv-card"><span class="material-icons-outlined">place</span>'
        + '      <h3>Contenedores cerca tuyo</h3>'
        + '      <p>El sistema mapea todos los contenedores de la ciudad con su ubicación exacta '
        + '      y su estado actual.</p></div>'
        + '    <div class="lv-card"><span class="material-icons-outlined">local_shipping</span>'
        + '      <h3>Recolección organizada</h3>'
        + '      <p>Cuadrillas y camiones trabajan coordinadamente para que la recolección sea '
        + '      eficiente en cada zona.</p></div>'
        + '    <div class="lv-card"><span class="material-icons-outlined">report_problem</span>'
        + '      <h3>Reportá problemas</h3>'
        + '      <p>Pronto vas a poder avisar sobre contenedores desbordados o dañados directamente '
        + '      desde acá.</p></div>'
        + '  </div>'
        + '  <div class="lv-footer">'
        + '    <p>Juntos hacemos una ciudad más limpia.</p>'
        + '  </div>'
        + '</div>';
    }

    function plantillaUsuarios() {
        return ''
        + '<div class="panel"><h3>Nuevo usuario</h3>'
        + '<form id="form-usuario" class="form-inline">'
        + '<div><label>Nombre</label><input type="text" id="u-nombre" required></div>'
        + '<div><label>Email</label><input type="email" id="u-email" required></div>'
        + '<div><label>Contraseña</label><input type="password" id="u-password" required></div>'
        + '<div><label>Rol</label><select id="u-rol" onchange="toggleEspecialidad()">'
        + '<option value="vecino">Vecino</option>'
        + '<option value="operario">Operario</option>'
        + '<option value="administrador">Administrador</option></select></div>'
        + '<div id="wrap-especialidad" style="display:none;"><label>Especialidad</label>'
        + '<select id="u-especialidad">'
        + '<option value="recoleccion">Recolección</option>'
        + '<option value="clasificacion">Clasificación</option>'
        + '<option value="vertedero">Vertedero</option></select></div>'
        + '<div class="full"><button type="submit" class="btn">Agregar usuario</button></div>'
        + '</form><p class="msg" id="u-msg"></p></div>'
        + '<table class="tabla"><thead><tr><th>ID</th><th>Nombre</th><th>Email</th>'
        + '<th>Rol</th><th>Acción</th></tr></thead><tbody id="tabla-usuarios"></tbody></table>'
        + '<h2 class="sec-titulo">Cuadrillas</h2>'
        + '<div id="cuad-filtro-aviso" class="filtro-aviso" style="display:none;">'
        + '<span>Mostrando solo la cuadrilla del camión seleccionado.</span>'
        + '<button class="btn-mini" onclick="limpiarFiltroCuadrilla()">Ver todas</button></div>'
        + '<div class="panel"><h3>Nueva cuadrilla</h3>'
        + '<form id="form-cuadrilla" class="form-inline">'
        + '<div><label>Nombre</label><input type="text" id="cu-nombre" required></div>'
        + '<div><label>Zona</label><input type="text" id="cu-zona"></div>'
        + '<div class="full"><button type="submit" class="btn">Crear cuadrilla</button></div>'
        + '</form><p class="msg" id="cu-msg"></p></div>'
        + '<table class="tabla"><thead><tr><th>ID</th><th>Nombre</th><th>Zona</th>'
        + '<th>Integrantes</th><th>Acción</th></tr></thead><tbody id="tabla-cuadrillas"></tbody></table>';
    }

    function plantillaContenedores() {
        return ''
        + '<div class="panel"><h3>Nuevo contenedor</h3>'
        + '<form id="form-contenedor" class="form-inline">'
        + '<div><label>Código</label><input type="text" id="c-codigo" required></div>'
        + '<div><label>Dirección</label><input type="text" id="c-direccion" required></div>'
        + '<div><label>Tipo de residuo</label><select id="c-tipo">'
        + '<option value="mezclado">Mezclado</option>'
        + '<option value="reciclable">Reciclable</option></select></div>'
        + '<div><label>Estado</label><select id="c-estado">'
        + '<option value="operativo">Operativo</option>'
        + '<option value="roto">Roto</option>'
        + '<option value="desbordado">Desbordado</option></select></div>'
        + '<div class="full"><label>Ubicación (hacé click en el mapa para marcarla)</label>'
        + '<div id="mapa-crear" class="mapa"></div>'
        + '<p class="mapa-coord" id="c-coord">Sin ubicación seleccionada.</p></div>'
        + '<div class="full"><button type="submit" class="btn">Agregar contenedor</button></div>'
        + '</form><p class="msg" id="c-msg"></p></div>'
        + '<h2 class="sec-titulo">Contenedores en el mapa</h2>'
        + '<div id="mapa-listado" class="mapa mapa-grande"></div>'
        + '<table class="tabla"><thead><tr><th>ID</th><th>Código</th><th>Dirección</th>'
        + '<th>Tipo</th><th>Estado</th><th>Acción</th></tr></thead>'
        + '<tbody id="tabla-contenedores"></tbody></table>';
    }

    function plantillaCamiones() {
        return ''
        + '<div class="panel"><h3>Nuevo camión</h3>'
        + '<form id="form-camion" class="form-inline">'
        + '<div><label>Patente</label><input type="text" id="k-patente" required></div>'
        + '<div><label>Modelo</label><input type="text" id="k-modelo" required></div>'
        + '<div><label>Estado</label><select id="k-estado">'
        + '<option value="operativo">Operativo</option>'
        + '<option value="mantenimiento">Mantenimiento</option></select></div>'
        + '<div><label>Disponibilidad</label><select id="k-disp">'
        + '<option value="disponible">Disponible</option>'
        + '<option value="en_ruta">En ruta</option></select></div>'
        + '<div><label>Flota</label><select id="k-flota"></select></div>'
        + '<div><label>Cuadrilla</label><select id="k-cuadrilla"></select></div>'
        + '<div class="full"><button type="submit" class="btn">Agregar camión</button></div>'
        + '</form><p class="msg" id="k-msg"></p></div>'
        + '<table class="tabla"><thead><tr><th>ID</th><th>Patente</th><th>Modelo</th>'
        + '<th>Estado</th><th>Disponibilidad</th><th>Flota</th><th>Cuadrilla</th>'
        + '<th>Acción</th></tr></thead><tbody id="tabla-camiones"></tbody></table>';
    }

    function plantillaFlotas() {
        return ''
        + '<div class="panel"><h3>Nueva flota</h3>'
        + '<form id="form-flota" class="form-inline">'
        + '<div><label>Nombre</label><input type="text" id="f-nombre" required></div>'
        + '<div><label>Zona</label><input type="text" id="f-zona"></div>'
        + '<div class="full"><button type="submit" class="btn">Crear flota</button></div>'
        + '</form><p class="msg" id="f-msg"></p></div>'
        + '<div id="panel-flotas"></div>';
    }

    // Muestra/oculta el selector de especialidad según el rol elegido.
    function toggleEspecialidad() {
        const rol = document.getElementById('u-rol').value;
        document.getElementById('wrap-especialidad').style.display =
            (rol === 'operario') ? 'block' : 'none';
    }

    // =============================================================
    //  USUARIOS (listado + alta + eliminar)
    // =============================================================
    async function cargarUsuarios() {
        const tbody = document.getElementById('tabla-usuarios');
        const esAdmin = usuarioActual && usuarioActual.rol === 'administrador';
        try {
            const resp = await fetchGet(API_USUARIOS + '/usuarios');
            const usuarios = await resp.json();
            tbody.innerHTML = usuarios.map(function (u) {
                let accion = '<button class="btn-editar" onclick="editarUsuario(' + u.id + ')">Editar</button>';
                if (esAdmin && u.id !== usuarioActual.id) {
                    accion += ' <button class="btn-eliminar" onclick="eliminarUsuario(' +
                        u.id + ", '" + u.nombre.replace(/'/g, "\\'") + "')" + '">Eliminar</button>';
                }
                // Mostramos rol + especialidad si es operario
                let rolTxt = u.rol;
                if (u.rol === 'operario' && u.especialidad) rolTxt += ' · ' + u.especialidad;
                return '<tr><td>' + u.id + '</td><td>' + u.nombre + '</td><td>' +
                    u.email + '</td><td>' + rolTxt + '</td><td>' + accion + '</td></tr>';
            }).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="5">Error al conectar con API Usuarios.</td></tr>';
        }

        // Enganchamos el form de alta (se recreó con la plantilla)
        const form = document.getElementById('form-usuario');
        if (form) form.onsubmit = altaUsuario;
    }

    async function altaUsuario(e) {
        e.preventDefault();
        const msg = document.getElementById('u-msg');
        msg.className = 'msg';
        const rol = document.getElementById('u-rol').value;
        const datos = {
            nombre:   document.getElementById('u-nombre').value.trim(),
            email:    document.getElementById('u-email').value.trim(),
            password: document.getElementById('u-password').value,
            rol:      rol,
        };
        if (rol === 'operario') {
            datos.especialidad = document.getElementById('u-especialidad').value;
        }
        try {
            const resp = await fetch(API_USUARIOS + '/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                msg.textContent = 'Usuario agregado.'; msg.classList.add('ok');
                e.target.reset();
                toggleEspecialidad();
                recargarSeccionActual();
            } else {
                msg.textContent = resultado.error; msg.classList.add('err');
            }
        } catch (err) {
            msg.textContent = 'Error de conexión.'; msg.classList.add('err');
        }
    }

    async function eliminarUsuario(id, nombre) {
        if (!confirm('¿Seguro que querés eliminar a "' + nombre + '"?')) return;
        try {
            const resp = await fetch(API_USUARIOS + '/usuarios/eliminar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, adminEmail: usuarioActual.email }),
            });
            const resultado = await resp.json();
            if (resp.ok) { recargarSeccionActual(); }
            else { alert(resultado.error || 'No se pudo eliminar.'); }
        } catch (err) {
            alert('Error de conexión al eliminar.');
        }
    }

    // =============================================================
    //  CONTENEDORES (con mapa interactivo Leaflet)
    // =============================================================
    // Centro aproximado de Montevideo.
    const MVD = [-34.9011, -56.1645];
    let mapaCrear = null, mapaListado = null;   // instancias de mapa
    let marcadorNuevo = null;                    // pin temporal al crear
    let coordNueva = { lat: null, lng: null };   // coords elegidas
    let capaPines = null;                        // capa de pines del listado

    // Colores del pin según estado del contenedor.
    function colorEstado(estado) {
        if (estado === 'desbordado') return '#d32f2f';
        if (estado === 'roto')       return '#f9a825';
        return '#1b8536'; // operativo
    }

    // Crea un ícono de pin de color (div simple, sin imágenes externas).
    function iconoPin(color) {
        return L.divIcon({
            className: 'pin-cont',
            html: '<span style="background:' + color + '"></span>',
            iconSize: [18, 18],
            iconAnchor: [9, 9],
        });
    }

    async function cargarContenedores() {
        const form = document.getElementById('form-contenedor');
        if (form) form.onsubmit = altaContenedor;

        // Si Leaflet no cargó (CDN bloqueado, sin internet), avisamos claro
        // en pantalla en vez de dejar los mapas en blanco sin explicación.
        if (typeof L === 'undefined') {
            const aviso = '<div class="mapa-error">No se pudo cargar el mapa (Leaflet). ' +
                'Verificá tu conexión a internet o si una extensión/firewall bloquea ' +
                '<b>unpkg.com</b> y <b>openstreetmap.org</b>. La tabla de abajo funciona igual.</div>';
            const mc = document.getElementById('mapa-crear');
            const ml = document.getElementById('mapa-listado');
            if (mc) mc.outerHTML = aviso;
            if (ml) ml.outerHTML = aviso;
            refrescarContenedores();
            return;
        }

        // Creamos los mapas cuando el layout ya está listo. Usamos dos tiempos:
        // 100ms para crear (el div ya tiene tamaño) y 300ms para invalidateSize
        // (por si el panel terminó de acomodarse recién ahí).
        setTimeout(function () {
            if (document.getElementById('mapa-crear') && !mapaCrear) {
                mapaCrear = L.map('mapa-crear').setView(MVD, 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap', maxZoom: 19,
                }).addTo(mapaCrear);
                mapaCrear.on('click', function (e) {
                    coordNueva.lat = e.latlng.lat;
                    coordNueva.lng = e.latlng.lng;
                    if (marcadorNuevo) {
                        marcadorNuevo.setLatLng(e.latlng);
                    } else {
                        marcadorNuevo = L.marker(e.latlng).addTo(mapaCrear);
                    }
                    const c = document.getElementById('c-coord');
                    if (c) c.textContent = 'Ubicación: ' +
                        e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5);
                });
            }

            if (document.getElementById('mapa-listado') && !mapaListado) {
                mapaListado = L.map('mapa-listado').setView(MVD, 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap', maxZoom: 19,
                }).addTo(mapaListado);
                capaPines = L.layerGroup().addTo(mapaListado);
            }

            refrescarContenedores();

            // Segundo tiempo: recalcular tamaño cuando todo está estable.
            setTimeout(function () {
                if (mapaCrear) mapaCrear.invalidateSize();
                if (mapaListado) mapaListado.invalidateSize();
            }, 250);
        }, 100);
    }

    // Trae los contenedores, llena la tabla y dibuja los pines en el mapa.
    async function refrescarContenedores() {
        const tbody = document.getElementById('tabla-contenedores');
        try {
            const lista = await (await fetchGet(API_GESTION + '/contenedores')).json();

            if (tbody) {
                tbody.innerHTML = lista.map(function (c) {
                    return '<tr><td>' + c.id + '</td><td>' + c.codigo + '</td><td>' +
                        c.direccion + '</td><td>' + c.tipoResiduo + '</td><td>' + c.estado + '</td><td>' +
                        '<button class="btn-editar" onclick="editarContenedor(' + c.id + ')">Editar</button> ' +
                        '<button class="btn-eliminar" onclick="eliminarContenedor(' + c.id + ')">Eliminar</button>' +
                        '</td></tr>';
                }).join('');
            }

            // Pines en el mapa del listado.
            if (capaPines) {
                capaPines.clearLayers();
                lista.forEach(function (c) {
                    if (c.lat === null || c.lng === null) return;
                    L.marker([c.lat, c.lng], { icon: iconoPin(colorEstado(c.estado)) })
                        .bindPopup('<b>' + c.codigo + '</b><br>' + c.direccion +
                                   '<br>Tipo: ' + c.tipoResiduo + '<br>Estado: ' + c.estado)
                        .addTo(capaPines);
                });
            }
        } catch (err) {
            if (tbody) tbody.innerHTML = '<tr><td colspan="6">Error al conectar con API Gestión.</td></tr>';
        }
    }

    async function altaContenedor(e) {
        e.preventDefault();
        const msg = document.getElementById('c-msg');
        msg.className = 'msg';
        if (coordNueva.lat === null || coordNueva.lng === null) {
            msg.textContent = 'Marcá la ubicación en el mapa antes de agregar.'; msg.classList.add('err');
            return;
        }
        const datos = {
            codigo:      document.getElementById('c-codigo').value.trim(),
            direccion:   document.getElementById('c-direccion').value.trim(),
            tipoResiduo: document.getElementById('c-tipo').value,
            estado:      document.getElementById('c-estado').value,
            lat:         coordNueva.lat,
            lng:         coordNueva.lng,
        };
        try {
            const resp = await fetch(API_GESTION + '/contenedores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos),
            });
            const resultado = await resp.json();
            if (resp.ok) {
                msg.textContent = 'Contenedor agregado.'; msg.classList.add('ok');
                e.target.reset();
                // Limpiamos el pin temporal y las coords.
                if (marcadorNuevo) { mapaCrear.removeLayer(marcadorNuevo); marcadorNuevo = null; }
                coordNueva = { lat: null, lng: null };
                const c = document.getElementById('c-coord');
                if (c) c.textContent = 'Sin ubicación seleccionada.';
                refrescarContenedores();
            } else {
                msg.textContent = resultado.error; msg.classList.add('err');
            }
        } catch (err) {
            msg.textContent = 'Error de conexión.'; msg.classList.add('err');
        }
    }

    async function eliminarContenedor(id) {
        if (!confirm('¿Eliminar este contenedor?')) return;
        try {
            const resp = await fetch(API_GESTION + '/contenedores/eliminar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id }),
            });
            if (resp.ok) refrescarContenedores();
            else { const r = await resp.json(); alert(r.error || 'No se pudo eliminar.'); }
        } catch (err) { alert('Error de conexión.'); }
    }

    // =============================================================
    //  CUADRILLAS (dentro de la sección Usuarios)
    // =============================================================
    async function cargarCuadrillas() {
        const tbody = document.getElementById('tabla-cuadrillas');
        if (!tbody) return;

        // Traemos usuarios (para nombres) y operarios de recolección libres.
        try { cacheUsuarios = await (await fetchGet(API_USUARIOS + '/usuarios')).json(); } catch (e) { cacheUsuarios = []; }
        let libres = [];
        try { libres = await (await fetchGet(API_USUARIOS + '/operarios-libres')).json(); } catch (e) { libres = []; }

        try {
            const resp = await fetchGet(API_USUARIOS + '/cuadrillas');
            cacheCuadrillas = await resp.json();

            // Filtro: si venimos de un click en camión, mostramos solo esa cuadrilla.
            let lista = cacheCuadrillas;
            const aviso = document.getElementById('cuad-filtro-aviso');
            if (cuadrillaFiltrada !== null) {
                lista = cacheCuadrillas.filter(function (c) { return c.id === cuadrillaFiltrada; });
                if (aviso) aviso.style.display = 'flex';
            } else if (aviso) {
                aviso.style.display = 'none';
            }

            tbody.innerHTML = lista.map(function (c) {
                const integrantes = c.operarios || [];

                // Lista de integrantes actuales, cada uno con botón "Quitar".
                let listaInt;
                if (integrantes.length === 0) {
                    listaInt = '<span class="txt-muted">Sin integrantes</span>';
                } else {
                    listaInt = '<div class="int-lista">' + integrantes.map(function (opId) {
                        const u = cacheUsuarios.find(function (x) { return x.id === opId; });
                        const nombre = u ? u.nombre : ('#' + opId);
                        return '<span class="int-chip">' + nombre +
                            '<button class="chip-x" title="Quitar" onclick="quitarOperario(' + c.id + ',' + opId + ')">&times;</button></span>';
                    }).join('') + '</div>';
                }

                // Selector para agregar un operario libre + botón.
                let agregar;
                if (libres.length === 0) {
                    agregar = '<span class="txt-muted int-nota">No hay operarios de recolección libres.</span>';
                } else {
                    const opts = libres.map(function (op) {
                        return '<option value="' + op.id + '">' + op.nombre + '</option>';
                    }).join('');
                    agregar = '<div class="int-agregar"><select id="add-op-' + c.id + '">' + opts + '</select>' +
                        '<button class="btn-mini" onclick="agregarOperario(' + c.id + ')">Agregar</button></div>';
                }

                return '<tr><td>' + c.id + '</td><td>' + c.nombre + '</td><td>' +
                    (c.zona || '—') + '</td><td>' + listaInt + agregar + '</td><td>' +
                    '<button class="btn-eliminar" onclick="eliminarCuadrilla(' + c.id + ')">Eliminar</button>' +
                    '</td></tr>';
            }).join('');
            if (lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="txt-muted">No hay cuadrillas para mostrar.</td></tr>';
            }
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="5">Error al conectar con API Usuarios.</td></tr>';
        }
        const form = document.getElementById('form-cuadrilla');
        if (form) form.onsubmit = altaCuadrilla;
    }

    // =============================================================
    //  CAMIONES
    // =============================================================
    async function cargarCamiones() {
        const tbody = document.getElementById('tabla-camiones');
        // Aseguramos tener flotas y cuadrillas en cache para mostrar nombres.
        if (cacheFlotas.length === 0) { try { cacheFlotas = await (await fetchGet(API_RECOLECCION + '/flotas')).json(); } catch (e) {} }
        if (cacheCuadrillas.length === 0) { try { cacheCuadrillas = await (await fetchGet(API_USUARIOS + '/cuadrillas')).json(); } catch (e) {} }
        try {
            const resp = await fetchGet(API_RECOLECCION + '/camiones');
            const lista = await resp.json();
            // Cuadrillas ya usadas por algún camión (para no repetir).
            const usadas = lista.filter(function (x) { return x.cuadrillaId !== null && x.cuadrillaId !== undefined; })
                                 .map(function (x) { return x.cuadrillaId; });
            tbody.innerHTML = lista.map(function (k) {
                // Selector de cuadrilla: ofrece las libres + la propia del camión.
                let opcCuad = '<option value="">(sin cuadrilla)</option>' +
                    cacheCuadrillas.filter(function (c) {
                        return usadas.indexOf(c.id) === -1 || c.id === k.cuadrillaId;
                    }).map(function (c) {
                        const sel = (c.id === k.cuadrillaId) ? ' selected' : '';
                        return '<option value="' + c.id + '"' + sel + '>' + c.nombre + '</option>';
                    }).join('');
                const selectCuad = '<select onchange="asignarCuadrilla(' + k.id + ', this.value)">' + opcCuad + '</select>';
                // Selector de flota en línea para mover el camión.
                let opcFlota = '<option value="">(sin flota)</option>' +
                    cacheFlotas.map(function (f) {
                        const sel = (f.id === k.flotaId) ? ' selected' : '';
                        return '<option value="' + f.id + '"' + sel + '>' + f.nombre + '</option>';
                    }).join('');
                const selectFlota = '<select onchange="moverAFlota(' + k.id + ', this.value)">' + opcFlota + '</select>';
                return '<tr><td>' + k.id + '</td><td>' + k.patente + '</td><td>' +
                    k.modelo + '</td><td>' + k.estado + '</td><td>' + k.disponibilidad + '</td><td>' +
                    selectFlota + '</td><td>' + selectCuad + '</td><td>' +
                    '<button class="btn-editar" onclick="editarCamion(' + k.id + ')">Editar</button> ' +
                    '<button class="btn-eliminar" onclick="eliminarCamion(' + k.id + ')">Eliminar</button>' +
                    '</td></tr>';
            }).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="8">Error al conectar con API Recolección.</td></tr>';
        }
        const form = document.getElementById('form-camion');
        if (form) form.onsubmit = altaCamion;
    }

    // Dibuja el panel: una TABLA por flota que engloba sus camiones.
    // Al clickear un camión, se navega a la cuadrilla asignada (sección Usuarios).
    async function cargarPanelFlotas() {
        const cont = document.getElementById('panel-flotas');
        const form = document.getElementById('form-flota');
        if (form) form.onsubmit = altaFlota;

        try {
            cacheFlotas     = await (await fetchGet(API_RECOLECCION + '/flotas')).json();
            cacheCuadrillas = await (await fetchGet(API_USUARIOS + '/cuadrillas')).json();
            const camiones  = await (await fetchGet(API_RECOLECCION + '/camiones')).json();

            let html = cacheFlotas.map(function (f) {
                const suyos = camiones.filter(function (k) { return k.flotaId === f.id; });
                // Camiones que NO están en ninguna flota (para el selector de agregar)
                const libres = camiones.filter(function (k) { return k.flotaId === null || k.flotaId === undefined; });

                let filas;
                if (suyos.length === 0) {
                    filas = '<tr><td colspan="4" class="flota-vacia">Sin camiones en esta flota</td></tr>';
                } else {
                    filas = suyos.map(function (k) {
                        const cuadTxt = (k.cuadrillaId === null || k.cuadrillaId === undefined)
                            ? '<span class="txt-muted">Sin cuadrilla</span>'
                            : '<a class="link-cuad" onclick="irACuadrilla(' + k.cuadrillaId + ')">' +
                              nombreCuadrilla(k.cuadrillaId) + '</a>';
                        return '<tr class="fila-camion" onclick="clickCamionFlota(event, ' + k.id + ', ' +
                            (k.cuadrillaId === null ? 'null' : k.cuadrillaId) + ", '" + k.patente.replace(/'/g, '') + "')" + '">' +
                            '<td>' + k.patente + '</td><td>' + k.modelo + '</td><td>' + k.estado + '</td><td>' +
                            cuadTxt + '</td></tr>';
                    }).join('');
                }

                // Selector para agregar un camión libre a esta flota.
                const opcionesLibres = libres.length
                    ? libres.map(function (k) { return '<option value="' + k.id + '">' + k.patente + ' - ' + k.modelo + '</option>'; }).join('')
                    : '';
                const agregar = libres.length
                    ? '<div class="flota-agregar"><select id="add-flota-' + f.id + '">' +
                      '<option value="">Agregar camión sin flota…</option>' + opcionesLibres + '</select>' +
                      '<button class="btn-mini" onclick="agregarCamionAFlota(' + f.id + ')">Agregar</button></div>'
                    : '<p class="txt-muted flota-nota">No hay camiones sin flota para agregar.</p>';

                return '<div class="flota-bloque">' +
                    '<div class="flota-head"><h3>' + f.nombre + '</h3>' +
                    '<span class="flota-zona">' + (f.zona || '') + '</span>' +
                    '<button class="btn-eliminar" onclick="eliminarFlota(' + f.id + ')">Eliminar</button></div>' +
                    '<table class="tabla"><thead><tr><th>Patente</th><th>Modelo</th><th>Estado</th>' +
                    '<th>Cuadrilla</th></tr></thead><tbody>' + filas + '</tbody></table>' +
                    agregar + '</div>';
            }).join('');

            cont.innerHTML = html || '<p class="flota-vacia">No hay flotas. Creá una arriba.</p>';
        } catch (err) {
            cont.innerHTML = '<p class="flota-vacia">Error al conectar con las APIs.</p>';
        }
    }

    // Click en una fila de camión: si tocaste el link de la cuadrilla, ese link
    // ya maneja la navegación. Si tocaste el resto de la fila, vamos a la
    // cuadrilla igual (o avisamos si no tiene).
    function clickCamionFlota(event, camionId, cuadrillaId, patente) {
        if (event.target.classList.contains('link-cuad')) return; // lo maneja el link
        if (cuadrillaId === null || cuadrillaId === undefined) {
            alert('El camión ' + patente + ' no tiene cuadrilla asignada.');
            return;
        }
        irACuadrilla(cuadrillaId);
    }

    // Agrega un camión "libre" (sin flota) a una flota concreta.
    async function agregarCamionAFlota(flotaId) {
        const sel = document.getElementById('add-flota-' + flotaId);
        const camionId = sel ? sel.value : '';
        if (!camionId) { alert('Elegí un camión para agregar.'); return; }
        try {
            const resp = await fetch(API_RECOLECCION + '/camiones/asignar-flota', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: parseInt(camionId), flotaId: flotaId }),
            });
            if (resp.ok) recargarSeccionActual();
            else { const r = await resp.json(); alert(r.error || 'No se pudo agregar.'); }
        } catch (err) { alert('Error de conexión.'); }
    }

    // Navega a la sección Usuarios y muestra SOLO la cuadrilla indicada.
    function irACuadrilla(cuadrillaId) {
        cuadrillaFiltrada = cuadrillaId;
        // Simular click en el ítem de menú "Usuarios"
        mostrarSeccion('usuarios');
        const nav = document.getElementById('nav-usuarios');
        if (nav) {
            document.querySelectorAll('.nav-item').forEach(function (a) { a.classList.remove('activo'); });
            nav.classList.add('activo');
        }
    }

    async function eliminarFlota(id) {
        if (!confirm('¿Eliminar esta flota?')) return;
        try {
            const resp = await fetch(API_RECOLECCION + '/flotas/eliminar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id }),
            });
            if (resp.ok) recargarSeccionActual();
            else { const r = await resp.json(); alert(r.error || 'No se pudo eliminar.'); }
        } catch (err) { alert('Error de conexión.'); }
    }

    // =============================================================
    //  MODAL DE EDICIÓN (reutilizable)
    // =============================================================
    function abrirModal(titulo, htmlCuerpo, onGuardar) {
        document.getElementById('modal-titulo').textContent = titulo;
        document.getElementById('modal-cuerpo').innerHTML = htmlCuerpo;
        document.getElementById('modal-msg').textContent = '';
        document.getElementById('modal-msg').className = 'msg';
        document.getElementById('modal-editar').classList.remove('oculto');
        // El botón "Guardar" del cuerpo llama a la función que pasamos.
        const btn = document.getElementById('modal-guardar');
        if (btn) btn.onclick = onGuardar;
    }

    function cerrarModal() {
        document.getElementById('modal-editar').classList.add('oculto');
    }

    function modalError(texto) {
        const m = document.getElementById('modal-msg');
        m.textContent = texto; m.className = 'msg err';
    }

    // -------- EDITAR USUARIO --------
    function editarUsuario(id) {
        const u = cacheUsuarios.find(function (x) { return x.id === id; });
        if (!u) return;
        const esOperario = u.rol === 'operario';
        const cuerpo =
            '<div class="form-modal">'
            + '<label>Nombre</label><input type="text" id="e-nombre" value="' + (u.nombre || '') + '">'
            + '<label>Email</label><input type="email" id="e-email" value="' + (u.email || '') + '">'
            + '<label>Contraseña (dejar vacío para no cambiarla)</label><input type="password" id="e-password" placeholder="••••••">'
            + '<label>Rol</label><select id="e-rol" onchange="toggleEspecialidadEdit()">'
            + '<option value="vecino"' + (u.rol === 'vecino' ? ' selected' : '') + '>Vecino</option>'
            + '<option value="operario"' + (u.rol === 'operario' ? ' selected' : '') + '>Operario</option>'
            + '<option value="administrador"' + (u.rol === 'administrador' ? ' selected' : '') + '>Administrador</option>'
            + '</select>'
            + '<div id="e-wrap-esp" style="' + (esOperario ? '' : 'display:none;') + '">'
            + '<label>Especialidad</label><select id="e-especialidad">'
            + '<option value="recoleccion"' + (u.especialidad === 'recoleccion' ? ' selected' : '') + '>Recolección</option>'
            + '<option value="clasificacion"' + (u.especialidad === 'clasificacion' ? ' selected' : '') + '>Clasificación</option>'
            + '<option value="vertedero"' + (u.especialidad === 'vertedero' ? ' selected' : '') + '>Vertedero</option>'
            + '</select></div>'
            + '<button class="btn" id="modal-guardar">Guardar cambios</button></div>';

        abrirModal('Editar usuario', cuerpo, async function () {
            const datos = {
                id: id,
                nombre: document.getElementById('e-nombre').value.trim(),
                email: document.getElementById('e-email').value.trim(),
                password: document.getElementById('e-password').value,
                rol: document.getElementById('e-rol').value,
            };
            if (datos.rol === 'operario') datos.especialidad = document.getElementById('e-especialidad').value;
            try {
                const resp = await fetch(API_USUARIOS + '/usuarios/modificar', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos),
                });
                const r = await resp.json();
                if (resp.ok) { cerrarModal(); recargarSeccionActual(); }
                else modalError(r.error || 'No se pudo modificar.');
            } catch (e) { modalError('Error de conexión.'); }
        });
    }
    function toggleEspecialidadEdit() {
        const rol = document.getElementById('e-rol').value;
        document.getElementById('e-wrap-esp').style.display = (rol === 'operario') ? 'block' : 'none';
    }

    // -------- EDITAR CONTENEDOR --------
    let modalMapa = null, modalMarcador = null, modalCoord = { lat: null, lng: null };
    function editarContenedor(id) {
        // Buscamos el contenedor en la última lista cargada.
        fetchGet(API_GESTION + '/contenedores').then(function (resp) { return resp.json(); }).then(function (lista) {
            const c = lista.find(function (x) { return x.id === id; });
            if (!c) return;
            modalCoord = { lat: c.lat, lng: c.lng };
            const cuerpo =
                '<div class="form-modal">'
                + '<label>Código</label><input type="text" id="e-codigo" value="' + (c.codigo || '') + '">'
                + '<label>Dirección</label><input type="text" id="e-direccion" value="' + (c.direccion || '') + '">'
                + '<label>Tipo de residuo</label><select id="e-tipo">'
                + '<option value="mezclado"' + (c.tipoResiduo === 'mezclado' ? ' selected' : '') + '>Mezclado</option>'
                + '<option value="reciclable"' + (c.tipoResiduo === 'reciclable' ? ' selected' : '') + '>Reciclable</option></select>'
                + '<label>Estado</label><select id="e-estado">'
                + '<option value="operativo"' + (c.estado === 'operativo' ? ' selected' : '') + '>Operativo</option>'
                + '<option value="roto"' + (c.estado === 'roto' ? ' selected' : '') + '>Roto</option>'
                + '<option value="desbordado"' + (c.estado === 'desbordado' ? ' selected' : '') + '>Desbordado</option></select>'
                + '<label>Ubicación (click en el mapa para cambiarla)</label>'
                + '<div id="modal-mapa" class="mapa"></div>'
                + '<p class="mapa-coord" id="e-coord">Ubicación actual: ' + c.lat + ', ' + c.lng + '</p>'
                + '<button class="btn" id="modal-guardar">Guardar cambios</button></div>';

            abrirModal('Editar contenedor', cuerpo, async function () {
                const datos = {
                    id: id,
                    codigo: document.getElementById('e-codigo').value.trim(),
                    direccion: document.getElementById('e-direccion').value.trim(),
                    tipoResiduo: document.getElementById('e-tipo').value,
                    estado: document.getElementById('e-estado').value,
                    lat: modalCoord.lat, lng: modalCoord.lng,
                };
                try {
                    const resp = await fetch(API_GESTION + '/contenedores/modificar', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datos),
                    });
                    const r = await resp.json();
                    if (resp.ok) { cerrarModal(); refrescarContenedores(); }
                    else modalError(r.error || 'No se pudo modificar.');
                } catch (e) { modalError('Error de conexión.'); }
            });

            // Mini-mapa dentro del modal para reubicar.
            if (typeof L !== 'undefined') {
                setTimeout(function () {
                    modalMapa = L.map('modal-mapa').setView([c.lat || MVD[0], c.lng || MVD[1]], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(modalMapa);
                    if (c.lat && c.lng) modalMarcador = L.marker([c.lat, c.lng]).addTo(modalMapa);
                    modalMapa.on('click', function (e) {
                        modalCoord.lat = e.latlng.lat; modalCoord.lng = e.latlng.lng;
                        if (modalMarcador) modalMarcador.setLatLng(e.latlng);
                        else modalMarcador = L.marker(e.latlng).addTo(modalMapa);
                        document.getElementById('e-coord').textContent =
                            'Nueva ubicación: ' + e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5);
                    });
                    setTimeout(function () { modalMapa.invalidateSize(); }, 200);
                }, 100);
            }
        });
    }

    // -------- EDITAR CAMIÓN --------
    function editarCamion(id) {
        fetchGet(API_RECOLECCION + '/camiones').then(function (resp) { return resp.json(); }).then(function (lista) {
            const k = lista.find(function (x) { return x.id === id; });
            if (!k) return;
            const cuerpo =
                '<div class="form-modal">'
                + '<label>Patente</label><input type="text" id="e-patente" value="' + (k.patente || '') + '">'
                + '<label>Modelo</label><input type="text" id="e-modelo" value="' + (k.modelo || '') + '">'
                + '<label>Estado</label><select id="e-kestado">'
                + '<option value="operativo"' + (k.estado === 'operativo' ? ' selected' : '') + '>Operativo</option>'
                + '<option value="mantenimiento"' + (k.estado === 'mantenimiento' ? ' selected' : '') + '>Mantenimiento</option></select>'
                + '<label>Disponibilidad</label><select id="e-kdisp">'
                + '<option value="disponible"' + (k.disponibilidad === 'disponible' ? ' selected' : '') + '>Disponible</option>'
                + '<option value="en_ruta"' + (k.disponibilidad === 'en_ruta' ? ' selected' : '') + '>En ruta</option></select>'
                + '<button class="btn" id="modal-guardar">Guardar cambios</button></div>';

            abrirModal('Editar camión', cuerpo, async function () {
                const datos = {
                    id: id,
                    patente: document.getElementById('e-patente').value.trim(),
                    modelo: document.getElementById('e-modelo').value.trim(),
                    estado: document.getElementById('e-kestado').value,
                    disponibilidad: document.getElementById('e-kdisp').value,
                };
                try {
                    const resp = await fetch(API_RECOLECCION + '/camiones/modificar', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(datos),
                    });
                    const r = await resp.json();
                    if (resp.ok) { cerrarModal(); recargarSeccionActual(); }
                    else modalError(r.error || 'No se pudo modificar.');
                } catch (e) { modalError('Error de conexión.'); }
            });
        });
    }

    // Al abrir la página, intentamos restaurar una sesión guardada
    // (para que un refresco no devuelva al login).
    restaurarSesion();
</script>
